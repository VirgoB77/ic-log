name: 大店立地法の届出をためる

# 手で押して動かす。あわせて毎日1回、朝に自動で走る。
# 自動を止めたいときは、下の schedule の3行を消す。
on:
  workflow_dispatch:
    inputs:
      area:
        description: "どこを見るか（hyogo / osaka / ref。空なら全部）"
        required: false
        default: ""
  schedule:
    # 毎日 日本時間 朝7時（UTCの22時）。縦覧は4か月で落ちるので、
    # 毎日とっておくと「いつ消えたか」が git の履歴に残る。
    - cron: "0 22 * * *"

# 二重に走ると、お互いの結果を押し合うことになるので1本ずつ走らせる
concurrency:
  group: shutten
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 偵察する
        run: python3 shutten/recon.py ${{ github.event.inputs.area }}

      - name: 届出を取り出す
        run: python3 shutten/parse.py

      # 大阪府・大阪市は届出をExcelで出している。
      # すでに持っている版は飛ばすので、更新された時だけ増える。
      - name: Excelを取ってくる
        run: python3 shutten/files.py

      - name: 結果をしまう
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shutten/data
          if git diff --cached --quiet; then
            echo "変わりなし。今日は何も起きていない"
            exit 0
          fi
          git commit -m "大店立地法の届出を $(date -u +%Y-%m-%d) の時点でためた"

          # 走っている間に、誰かが別の作業を main に入れていることがある。
          # そのまま送ると押し戻されて、集めたデータが消えてしまう。
          # 取り込み直してから送る。何度か試す。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "送れた"
              exit 0
            fi
            echo "押し戻されたので取り込み直す（${i}回目）"
            git pull --rebase origin main || {
              echo "取り込みに失敗した。手で見る必要がある"
              exit 1
            }
            sleep $((i * 3))
          done
          echo "5回試したが送れなかった"
          exit 1
