name: 大店立地法の届出をためる

# 手で押して動かす。あわせて毎日1回、朝に自動で走る。
# 自動を止めたいときは、下の schedule の3行を消す。
on:
  workflow_dispatch:
    inputs:
      area:
        description: "どこを見るか（hyogo / osaka / ref。空なら全部）"
        required: false
        default: ""
  schedule:
    # 毎日 日本時間 朝7時（UTCの22時）。縦覧は4か月で落ちるので、
    # 毎日とっておくと「いつ消えたか」が git の履歴に残る。
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 偵察する
        run: python3 shutten/recon.py ${{ github.event.inputs.area }}

      - name: 届出を取り出す
        run: python3 shutten/parse.py

      # 大阪府・大阪市は届出をExcelで出している。
      # すでに持っている版は飛ばすので、更新された時だけ増える。
      - name: Excelを取ってくる
        run: python3 shutten/files.py

      - name: 結果をしまう
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shutten/data
          if git diff --cached --quiet; then
            echo "変わりなし。今日は何も起きていない"
          else
            git commit -m "大店立地法の届出を $(date -u +%Y-%m-%d) の時点でためた"
            git push
          fi
