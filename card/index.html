<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0432b">
<meta name="apple-mobile-web-app-title" content="めいしばこ">
<title>めいしばこ</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600;900&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f6f3ee; --card:#ffffff; --ink:#1c1a17; --sub:#77706a; --rule:#e5dfd5; --field:#f1ece4;
  --key:#c0432b; --key-deep:#8f2f1d; --key-soft:#fbeae5; --on-key:#ffffff;
  --ok:#2c6d4f; --mute:#8d857d;
  --shadow:0 1px 2px rgba(40,30,20,.05), 0 10px 30px rgba(40,30,20,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ground:#141210; --card:#1f1c19; --ink:#ede7de; --sub:#a09890; --rule:#332e28; --field:#191614;
    --key:#e2775e; --key-deep:#a8412c; --key-soft:#2a1a15; --on-key:#1a0f0c;
    --ok:#5fae86; --mute:#8e857c;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.mincho{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif}

.wrap{max-width:620px;margin:0 auto;padding:0 16px calc(56px + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 2px 4px}
header h1{font-family:"Zen Old Mincho",serif;font-size:19px;font-weight:900;letter-spacing:.1em;margin:0}
header .n{font-size:12px;color:var(--sub);letter-spacing:.04em}
header .sp{flex:1}
.gear{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--sub);
  width:38px;height:38px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.gear:focus-visible{outline:2px solid var(--key);outline-offset:2px}

.shoot{display:block;width:100%;border:0;cursor:pointer;color:var(--on-key);border-radius:18px;
  padding:24px 18px;margin-top:12px;font:inherit;text-align:center;
  background:linear-gradient(165deg,var(--key),var(--key-deep));box-shadow:var(--shadow);
  -webkit-tap-highlight-color:transparent;transition:transform .09s ease, filter .15s ease}
.shoot:active{transform:scale(.985);filter:brightness(.93)}
.shoot:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.shoot b{display:block;font-size:23px;font-weight:900;letter-spacing:.16em;line-height:1.3}
.shoot span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;opacity:.9;margin-top:3px}
.sub-act{display:block;width:100%;margin-top:8px;appearance:none;border:0;background:transparent;
  color:var(--sub);font:inherit;font-size:13px;font-weight:700;padding:6px;cursor:pointer;text-decoration:underline}

.find{position:relative;margin-top:18px}
.find input[type=search]{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:12px;padding:13px 14px 13px 42px;box-shadow:var(--shadow);-webkit-appearance:none}
.find input[type=search]:focus-visible{outline:2px solid var(--key);outline-offset:1px}
.find .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px;pointer-events:none}

.count{font-size:11.5px;color:var(--sub);letter-spacing:.08em;margin:18px 4px 0;font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:9px}
@media (min-width:520px){ .grid{grid-template-columns:1fr 1fr 1fr} }
.tile{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--key);outline-offset:3px;border-radius:12px}
.tile .pic{aspect-ratio:91/55;border-radius:11px;overflow:hidden;background:var(--field);
  border:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pic .no{font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.tile .nm{font-family:"Zen Old Mincho",serif;font-size:15.5px;font-weight:700;line-height:1.45;margin-top:8px;word-break:break-word}
.tile .co{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:1px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.empty{color:var(--sub);font-size:13.5px;text-align:center;padding:34px 14px;line-height:2.1}
.empty b{color:var(--ink)}

/* ===== 下から出る画面 ===== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--card);width:100%;max-width:620px;max-height:94vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet h2{font-family:"Zen Old Mincho",serif;margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:.05em;word-break:break-word}
.sheet .lead{font-size:13px;color:var(--sub);margin:5px 0 0;word-break:break-word}

.pic-big{display:block;width:100%;padding:0;border:1px solid var(--rule);border-radius:13px;overflow:hidden;
  background:#0c0b0a;margin-top:14px;cursor:zoom-in}
.pic-big img{width:100%;display:block}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.1em;margin:17px 0 6px}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=search],textarea,select{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:10px;padding:12px 13px;-webkit-appearance:none}
textarea{line-height:1.75;resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--key);outline-offset:1px}
.name-in{font-family:"Zen Old Mincho",serif;font-size:21px !important;font-weight:700}
.half{display:flex;gap:10px}
.half>div{flex:1;min-width:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 1px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--sub);font:inherit;
  font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--key);border-color:var(--key);color:var(--on-key)}
.chip:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.cap{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin:11px 2px 0}

details.more{margin-top:16px;border-top:1px solid var(--rule);padding-top:4px}
details.more>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--key);
  letter-spacing:.05em;padding:11px 2px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"＋ ";font-weight:900}
details.more[open]>summary::before{content:"− "}
details.more>summary .got{color:var(--ok);font-size:11.5px;margin-left:6px}

.btn{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;
  font-weight:700;letter-spacing:.04em;border-radius:11px;padding:13px 14px;cursor:pointer;width:100%;margin-top:10px}
.btn:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.btn.primary{background:var(--key);border-color:var(--key);color:var(--on-key);font-size:16px;padding:15px}
.btn.danger{color:var(--key);border-color:var(--key)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px}

.facts{margin:16px 0 0;border-top:1px solid var(--rule)}
.facts .f{display:flex;gap:12px;border-bottom:1px solid var(--rule);padding:11px 2px;align-items:baseline}
.facts .k{flex:none;width:70px;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.facts .v{flex:1;min-width:0;font-size:15px;word-break:break-word;white-space:pre-wrap}
.facts .v a{color:var(--key);font-weight:700;text-decoration:none;border-bottom:1px solid var(--key)}

.bar{height:7px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--key);border-radius:99px;transition:width .3s ease}
.reading{font-size:13px;color:var(--sub);margin:9px 2px 0;font-weight:700}
.warn{font-size:12.5px;color:var(--key);background:var(--key-soft);border:1px solid var(--key);
  border-radius:11px;padding:11px 13px;margin-top:12px;line-height:1.75}

.hint{font-size:11.5px;color:var(--sub);line-height:1.85;margin:8px 2px 0}
.credit{font-size:10.5px;color:var(--sub);text-align:center;letter-spacing:.03em;margin:30px 0 0;opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;background:var(--ink);color:var(--ground);
  font-size:14px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.busy{position:fixed;inset:0;z-index:90;background:rgba(20,14,10,.45);display:flex;align-items:center;justify-content:center}
.busy span{background:var(--card);color:var(--ink);font-size:14px;font-weight:700;padding:15px 24px;border-radius:13px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>めいしばこ</h1>
    <span class="n" id="hdn"></span>
    <span class="sp"></span>
    <button class="gear" id="btn-gear" aria-label="設定">⚙</button>
  </header>

  <button class="shoot" id="btn-shoot">
    <b>名刺を撮る</b>
    <span>撮ると、名前や電話を自分で読みとります</span>
  </button>
  <button class="sub-act" id="btn-pick">写真から選ぶ</button>
  <input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-pick" accept="image/*" hidden>

  <div class="find">
    <span class="mag">🔍</span>
    <input type="search" id="q" placeholder="名前・会社・場所・メモ　どれでも" autocomplete="off">
  </div>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <div id="none" hidden></div>

  <p class="credit">写真も記録もこの端末の中だけ。文字を読むのも端末の中で行います。</p>
</div>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="viewer" id="viewer" hidden><img id="viewer-img" alt="名刺"></div>

<script>
(function(){
'use strict';

/* ===================== 文字を読む部品の置き場所 =====================
   ふだんは CDN から取ってくる。自分で置きたいときは ?ocr=（置いた場所）を付けて開く。
   置き場所には tesseract.min.js / worker.min.js / core/ / lang/ を入れておく。      */
var OCRBASE = (function(){
  var m = location.search.match(/[?&]ocr=([^&]+)/);
  return m ? decodeURIComponent(m[1]).replace(/\/$/, '') : '';
})();
var OCR = OCRBASE ? {
  lib:    OCRBASE + '/tesseract.min.js',
  worker: OCRBASE + '/worker.min.js',
  core:   OCRBASE + '/core',
  lang:   OCRBASE + '/lang'
} : {
  lib:    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  lang:   'https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int'
};

/* ===================== 保存（端末内のみ） ===================== */
var KEY = 'meishi.v1';
var db = { cards:[], mail:'' };
(function load(){
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if (raw && typeof raw === 'object'){
    db.cards = Array.isArray(raw.cards) ? raw.cards : [];
    db.mail  = typeof raw.mail === 'string' ? raw.mail : '';
  }
  for (var i = 0; i < db.cards.length; i++){
    var c = db.cards[i];
    if (!c.id) c.id = uid();
    if (!c.ts) c.ts = Date.now();
  }
})();
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('保存できませんでした。端末の空き容量を確認してください'); }
}

/* 名刺の写真は大きいので IndexedDB に置く */
var IDB = (function(){
  var dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if (!window.indexedDB){ rej(new Error('indexedDB なし')); return; }
      var rq = indexedDB.open('meishi', 1);
      rq.onupgradeneeded = function(){
        var d = rq.result;
        if (!d.objectStoreNames.contains('shots')) d.createObjectStore('shots', { keyPath:'id' });
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror   = function(){ rej(rq.error); };
    });
    return dbp;
  }
  function work(mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction('shots', mode), rq = fn(t.objectStore('shots'));
        t.oncomplete = function(){ res(rq ? rq.result : null); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    get:   function(id){ return work('readonly',  function(s){ return s.get(id); }); },
    put:   function(o){  return work('readwrite', function(s){ return s.put(o); }); },
    del:   function(id){ return work('readwrite', function(s){ return s.delete(id); }); },
    all:   function(){   return work('readonly',  function(s){ return s.getAll ? s.getAll() : null; }); },
    clear: function(){   return work('readwrite', function(s){ return s.clear(); }); }
  };
})();
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }

/* ===================== 小道具 ===================== */
var $ = function(id){ return document.getElementById(id); };
var WD = ['日','月','火','水','木','金','土'];
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function two(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function trim(s){ return String(s == null ? '' : s).trim(); }
function ymd(d){ return d.getFullYear() + '-' + two(d.getMonth()+1) + '-' + two(d.getDate()); }
function today(){ return ymd(new Date()); }
function toDate(s){
  if (!s) return null;
  var p = String(s).split('-');
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(s){ var d = toDate(s); return d ? (d.getMonth()+1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）' : ''; }

var toastTimer = null;
function toast(msg){
  var el = document.querySelector('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2800);
}
function busy(on, msg){
  var el = document.querySelector('.busy');
  if (on){
    if (!el){ el = document.createElement('div'); el.className='busy'; el.innerHTML='<span></span>'; document.body.appendChild(el); }
    el.firstChild.textContent = msg || 'しばらくお待ちください…';
  } else if (el && el.parentNode) el.parentNode.removeChild(el);
}

/* 探すときは、大文字小文字・全角半角・カタカナひらがな・「株式会社」を区別しない */
function norm(s){
  s = String(s == null ? '' : s).toLowerCase();
  s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });
  s = s.replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
  s = s.replace(/株式会社|有限会社|合同会社|一般社団法人|\(株\)|（株）|\(有\)|（有）/g, '');
  return s.replace(/[\s　・ー\-‐-―()（）.,、。]/g, '');
}

/* ===================== 名刺 ===================== */
var F = ['name','kana','company','dept','title','tel','mobile','email','url','addr','met','where','memo'];
function fullName(c){ return trim(c.name) || (trim(c.company) ? trim(c.company) : '名前がまだ'); }
function orgLine(c){ return [trim(c.company), trim(c.dept), trim(c.title)].filter(Boolean).join(' '); }
function matches(c, q){
  if (!q) return true;
  var hay = norm(F.map(function(k){ return c[k]; }).join(' '));
  var t = q.split(/[\s　]+/).filter(Boolean);
  for (var i = 0; i < t.length; i++) if (hay.indexOf(norm(t[i])) < 0) return false;
  return true;
}

/* ===================== 写真 ===================== */
var thumbCache = {};
function readImage(file, cb){
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload  = function(){ cb(im); setTimeout(function(){ URL.revokeObjectURL(url); }, 3000); };
  im.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  im.src = url;
}
function scaleTo(src, maxEdge, q){
  var w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  if (!w || !h) return null;
  var s = Math.min(1, maxEdge / Math.max(w, h));
  var cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
  var cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  var cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch);
  cx.drawImage(src, 0, 0, cw, ch);
  return cv.toDataURL('image/jpeg', q);
}
/* 文字を読ませるための下ごしらえ：長辺2000pxまで拡大し、白黒にして濃淡を強める */
function forOcr(src){
  var w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  var s = Math.min(3, 2000 / Math.max(w, h));
  var cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
  var cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  var cx = cv.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(src, 0, 0, cw, ch);
  try {
    var d = cx.getImageData(0, 0, cw, ch), p = d.data;
    for (var i = 0; i < p.length; i += 4){
      var g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
      g = g < 128 ? Math.max(0, (g-40)*1.6) : Math.min(255, (g-128)*1.6 + 150);
      p[i] = p[i+1] = p[i+2] = g;
    }
    cx.putImageData(d, 0, 0);
  } catch(e){}
  return cv;
}
function rot90(dataUrl, cb){
  var im = new Image();
  im.onload = function(){
    var cv = document.createElement('canvas');
    cv.width = im.naturalHeight; cv.height = im.naturalWidth;
    var cx = cv.getContext('2d');
    cx.translate(cv.width/2, cv.height/2);
    cx.rotate(Math.PI/2);
    cx.drawImage(im, -im.naturalWidth/2, -im.naturalHeight/2);
    cb(cv.toDataURL('image/jpeg', 0.85));
  };
  im.onerror = function(){ cb(null); };
  im.src = dataUrl;
}
function putShot(id, shot){
  return IDB.put({ id:id, full:shot.full, thumb:shot.thumb }).then(function(){
    thumbCache[id] = shot.thumb;
  }, function(){ toast(idbOK ? '写真を保存できませんでした。空き容量を確認してください' : 'この開き方では写真を保存できません'); });
}
function getShot(id){ return IDB.get(id).catch(function(){ return null; }); }
function delShot(id){ delete thumbCache[id]; return IDB.del(id).catch(function(){}); }
var idbOK = true;
IDB.get('__probe__').then(function(){}, function(){ idbOK = false; });

/* ===================== 名刺の文字を読む =====================
   Tesseract（オープンソースの文字読み取り）を端末の中で動かす。
   写真はどこにも送らない。初回だけ部品の取り込みに数MBかかる。      */
var tessScriptP = null, tessWorkerP = null, progressCb = null;

function loadScript(src){
  if (tessScriptP) return tessScriptP;
  tessScriptP = new Promise(function(res, rej){
    if (window.Tesseract) { res(); return; }
    var s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload  = function(){ res(); };
    s.onerror = function(){ tessScriptP = null; rej(new Error('部品を取り込めませんでした')); };
    document.head.appendChild(s);
  });
  return tessScriptP;
}
function getWorker(){
  if (tessWorkerP) return tessWorkerP;
  tessWorkerP = loadScript(OCR.lib).then(function(){
    if (!window.Tesseract) throw new Error('部品を取り込めませんでした');
    return window.Tesseract.createWorker('jpn', 1, {
      workerPath: OCR.worker, corePath: OCR.core, langPath: OCR.lang, gzip: true,
      logger: function(m){ if (progressCb) progressCb(m); }
    });
  }).then(function(w){
    return w.setParameters({ tessedit_pageseg_mode:'3', preserve_interword_spaces:'1' })
            .then(function(){ return w; });
  });
  tessWorkerP['catch'](function(){ tessWorkerP = null; });
  return tessWorkerP;
}
function readCard(img, onProg){
  progressCb = onProg || null;
  return getWorker().then(function(w){
    return w.recognize(forOcr(img), {}, { blocks:true, text:true });
  }).then(function(r){
    progressCb = null;
    return linesOf(r.data);
  }, function(err){
    progressCb = null;
    throw err;
  });
}
function linesOf(data){
  var out = [];
  (data.blocks || []).forEach(function(b){
    (b.paragraphs || []).forEach(function(p){
      (p.lines || []).forEach(function(l){
        var t = String(l.text || '').replace(/[\s　]+/g, ' ').trim();
        if (!t) return;
        out.push({ t:t, h:Math.round(l.bbox.y1 - l.bbox.y0), c:Math.round(l.confidence), y:l.bbox.y0 });
      });
    });
  });
  if (!out.length && data.text){
    String(data.text).split('\n').forEach(function(t){
      t = t.replace(/[\s　]+/g,' ').trim();
      if (t) out.push({ t:t, h:0, c:80, y:0 });
    });
  }
  return out;
}

/* ===================== 読んだ文字を項目に割りふる ===================== */
function han(s){
  return String(s == null ? '' : s).replace(/[！-～]/g, function(c){
    return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/　/g, ' ');
}
function dashes(s){ return String(s).replace(/[‐‑‒–—―ー−ｰ]/g, '-'); }
function digitsFix(s){
  return String(s).replace(/[Ｏｏ○〇oO]/g, '0').replace(/[lI!|]/g, '1')
                  .replace(/[Ss]/g, '5').replace(/[Bb]/g, '8');
}
var RE_MAIL  = /[A-Za-z0-9][A-Za-z0-9._%+\-]*@[A-Za-z0-9][A-Za-z0-9\-]*(?:\.[A-Za-z0-9][A-Za-z0-9\-]*)+/;
var RE_LOCAL = /^[A-Za-z0-9][A-Za-z0-9._%+\-]*$/;
var RE_TEL   = /0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{3,4}/g;
var RE_CO    = /株式会社|有限会社|合同会社|合資会社|\(株\)|（株）|\(有\)|（有）|会社|事務所|法人|組合|協会|財団|社団|工業|産業|商事|物産|製作所|印刷|出版|銀行|信用金庫|建設|工務店|不動産|商店|運輸|電機|電気|設計|企画|システム|グループ|ホールディングス|カフェ|工房|商会|舎|亭|農園|クリニック|診療所|薬局|美容室|サロン|スタジオ|教室|Inc\.?|Corp|Co\.,?\s?Ltd|Ltd\.?|LLC|K\.K\./i;
var RE_TITLE = /代表取締役|取締役|代表社員|代表者|代表|会長|社長|専務|常務|本部長|統括|部長|次長|課長|係長|主任|主査|主幹|店主|店長|所長|支店長|工場長|室長|局長|主宰|オーナー|女将|チーフ|マネージャ|リーダー|顧問|参与|参事|理事|監査役|技師|税理士|公認会計士|弁護士|社会保険労務士|司法書士|行政書士|建築士|ディレクター|プランナー|コンサルタント/;
var RE_DEPT  = /(事業部|営業所|支店|支社|センター|本部|研究所|工場|グループ|チーム|部|課|室|係|局)$/;
var RE_ADDR  = /[都道府県]|[市区町村郡]/;

var RE_MLABEL = /(^|[\s　(（])(?:E[\s\-_]?mail|EMAIL|MAIL|Mail|mail|メール|Ｅメール|アドレス)[\s　\-]*[:：]?/gi;
function cleanMail(a){
  return a.replace(/^e[\-_]?mail(?=[A-Za-z0-9._%+\-])/i, '').replace(/^[.\-_]+/, '');
}
function pickEmail(line){
  var t = han(line).replace(RE_MLABEL, ' ').replace(/[\s　]/g, '');
  var m = t.match(RE_MAIL);
  if (m) return cleanMail(m[0]).toLowerCase().replace(/[.,;:]+$/, '');
  /* @ が Q・G・© に化けることが多い。e や o は本物の字のことが多いので触らない */
  var pos = [];
  for (var i = 1; i < t.length - 3; i++) if ('QGＱ©®'.indexOf(t.charAt(i)) >= 0) pos.push(i);
  for (var j = pos.length - 1; j >= 0; j--){
    var a = t.slice(0, pos[j]), b = t.slice(pos[j] + 1);
    var mb = b.match(/^[A-Za-z0-9][A-Za-z0-9.\-]*\.[A-Za-z]{2,}/);
    if (mb && a.length >= 2 && RE_LOCAL.test(a)) return cleanMail(a + '@' + mb[0]).toLowerCase();
  }
  return '';
}
function pickUrl(line){
  var t = han(line).replace(/[\s　]/g, '');
  if (t.indexOf('@') >= 0) return '';
  var m = t.match(/https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+/i);
  if (m) return m[0].replace(/[.,;:]+$/, '').toLowerCase();
  m = t.match(/(?:www\.)[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}/i);
  if (m) return m[0].replace(/[.,;:]+$/, '').toLowerCase();
  return '';
}
function pickPhones(lines){
  var tel = '', mobile = '';
  lines.forEach(function(L){
    var t = dashes(han(L.t));
    t.split(/(?=FAX|Fax|fax|ファックス)/).forEach(function(seg){
      if (/^(FAX|Fax|fax|ファックス)/.test(seg)) return;
      var isMob = /携帯|ケータイ|Mobile|MOBILE|mobile|Cell|CELL|\bM\./.test(seg);
      var ms = seg.match(RE_TEL);
      if (!ms) return;
      ms.forEach(function(n){
        var num = n.replace(/\s/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
        var d = num.replace(/\D/g, '');
        if (d.length < 10 || d.length > 11) return;
        if (isMob || /^0[789]0/.test(d)){ if (!mobile) mobile = num; }
        else if (!tel) tel = num;
      });
    });
  });
  return { tel:tel, mobile:mobile };
}
function pickZipAddr(lines){
  var zip = '', addr = '';
  lines.forEach(function(L){
    if (/TEL|FAX|PHONE|MOBILE/i.test(L.t) || /電話|携帯|ファックス/.test(L.t) || /@/.test(L.t)) return;
    var t = dashes(han(L.t));
    if (!zip && (/〒/.test(t) || /^[T干][^ELel]/.test(t) || RE_ADDR.test(L.t))){
      var m = t.match(/[〒T干]?\s*([0-9lI!Oo]{3})\s*-\s*([0-9lI!Oo]{4})/);
      if (m){
        var a = digitsFix(m[1]), b = digitsFix(m[2]);
        if (/^\d{3}$/.test(a) && /^\d{4}$/.test(b)) zip = a + '-' + b;
      }
    }
    if (!RE_ADDR.test(L.t)) return;
    var body = L.t.replace(/[〒T干]?\s*[0-9lI!Oo]{3}\s*[-‐]\s*[0-9lI!Oo]{4}\s*/g, ' ')
                  .replace(/^[^ぁ-んァ-ヶ一-龥0-9]+/, '')
                  .replace(/[\s　]+/g, ' ').trim();
    if (body.length > addr.length) addr = body;
  });
  return { zip:zip, addr:addr };
}
function parseCard(lines){
  var got = { name:'', kana:'', company:'', dept:'', title:'', tel:'', mobile:'', email:'', url:'', addr:'' };
  var used = {};
  lines.forEach(function(L, i){
    if (!got.email){ var e = pickEmail(L.t); if (e){ got.email = e; used[i] = 1; } }
  });
  lines.forEach(function(L, i){
    if (used[i] || got.url) return;
    var u = pickUrl(L.t); if (u){ got.url = u; used[i] = 1; }
  });
  var ph = pickPhones(lines);
  got.tel = ph.tel; got.mobile = ph.mobile;
  lines.forEach(function(L, i){ if (RE_TEL.test(han(L.t))) used[i] = 1; RE_TEL.lastIndex = 0; });

  var za = pickZipAddr(lines);
  got.addr = (za.zip ? '〒' + za.zip + ' ' : '') + za.addr;
  if (!za.addr && !za.zip) got.addr = '';
  lines.forEach(function(L, i){ if (RE_ADDR.test(L.t) && !/@/.test(L.t)) used[i] = 1; });

  /* 会社：会社らしい語を含み、いちばん大きい行 */
  var co = null;
  lines.forEach(function(L, i){
    if (used[i]) return;
    if (!RE_CO.test(L.t)) return;
    if (L.c < 40) return;
    if (!co || L.h > co.h) co = { L:L, i:i };
  });
  if (co){ got.company = co.L.t; used[co.i] = 1; }

  /* 部署と役職：名前と同じ行に並んでいることも多いので、余った語は名前の候補に回す */
  var residual = {};
  lines.forEach(function(L, i){
    if (used[i]) return;
    if (L.c < 40) return;
    var parts = L.t.split(/[\s　\/／・|]+/).filter(Boolean);
    var rest = [], hit = false;
    parts.forEach(function(w){
      if (!got.title && RE_TITLE.test(w)){ got.title = w; hit = true; }
      else if (!got.dept && RE_DEPT.test(w) && w.length <= 12){ got.dept = w; hit = true; }
      else rest.push(w);
    });
    if (!hit) return;
    if (rest.length) residual[i] = rest.join(' ');
    else used[i] = 1;
  });

  /* 名前：残った行のうち、いちばん字が大きいもの */
  var best = null;
  lines.forEach(function(L, i){
    if (used[i] || L.c < 55) return;
    var t = residual[i] != null ? residual[i] : L.t;
    if (t.length < 2 || t.length > 14) return;
    if (/[0-9@]/.test(han(t))) return;
    if (!/[一-龥ぁ-んァ-ヶ]/.test(t)) return;
    if (RE_CO.test(t) || RE_TITLE.test(t) || RE_DEPT.test(t)) return;
    if (!best || L.h > best.L.h) best = { L:L, i:i, t:t };
  });
  if (best){ got.name = best.t; used[best.i] = 1; }

  /* よみ：ひらがなだけの短い行 */
  lines.forEach(function(L, i){
    if (used[i] || got.kana) return;
    if (/^[ぁ-んー\s]{3,16}$/.test(L.t)){ got.kana = L.t; used[i] = 1; }
  });
  return got;
}
function candidates(lines){
  var seen = {}, out = [];
  lines.slice().sort(function(a, b){ return b.h - a.h; }).forEach(function(L){
    var t = L.t.trim();
    if (!t || t.length > 30 || L.c < 40) return;
    if (seen[t]) return;
    seen[t] = 1; out.push(t);
  });
  return out.slice(0, 10);
}

/* ===================== 下から出る画面 ===================== */
function openSheet(html, wire){
  $('panel').innerHTML = html;
  $('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  $('panel').scrollTop = 0;
  if (wire) wire();
}
function closeSheet(){
  $('sheet').hidden = true;
  $('panel').innerHTML = '';
  document.body.style.overflow = '';
}
$('sheet').addEventListener('click', function(ev){ if (ev.target === $('sheet')) closeSheet(); });
$('viewer').addEventListener('click', function(){ $('viewer').hidden = true; $('viewer-img').src = ''; });
function showBig(src){ if (!src) return; $('viewer-img').src = src; $('viewer').hidden = false; }

/* ===================== 一覧 ===================== */
var BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function tileHtml(c){
  var pic = c.shot
    ? '<img src="' + BLANK + '" data-th="' + esc(c.id) + '" alt="">'
    : '<span class="no">写真なし</span>';
  return '<button class="tile" data-id="' + esc(c.id) + '">' +
    '<span class="pic">' + pic + '</span>' +
    '<span class="nm">' + esc(fullName(c)) + '</span>' +
    (orgLine(c) ? '<span class="co">' + esc(orgLine(c)) + '</span>' : '') +
    '</button>';
}
function fillThumbs(root){
  var imgs = (root || document).querySelectorAll('img[data-th]');
  for (var i = 0; i < imgs.length; i++){
    (function(el){
      var id = el.getAttribute('data-th');
      if (thumbCache[id]){ el.src = thumbCache[id]; return; }
      getShot(id).then(function(s){ if (s && s.thumb){ thumbCache[id] = s.thumb; el.src = s.thumb; } });
    })(imgs[i]);
  }
}
function renderGrid(){
  var q = trim($('q').value);
  var list = db.cards.filter(function(c){ return matches(c, q); }).sort(function(a, b){ return b.ts - a.ts; });
  $('hdn').textContent = db.cards.length ? db.cards.length + '枚' : '';
  $('grid').innerHTML = list.map(tileHtml).join('');
  fillThumbs($('grid'));
  var none = $('none');
  if (!db.cards.length){
    $('count').textContent = '';
    none.hidden = false;
    none.innerHTML = '<p class="empty">まだ1枚も入っていない。<br>' +
      '<b>名刺を撮る</b>を押して、手元の1枚を撮ってみる。<br>' +
      '名前も会社も電話も、写真から自分で読みとる。</p>';
  } else if (!list.length){
    $('count').textContent = '';
    none.hidden = false;
    none.innerHTML = '<p class="empty">見つからなかった。<br>ことばを減らすか、ひらがなだけで探してみる。</p>';
  } else {
    $('count').textContent = q ? list.length + '枚 見つかった' : '新しい順';
    none.hidden = true;
  }
}

/* ===================== 撮ってからしまうまで ===================== */
var pend = null;        /* まだしまっていない写真 { full, thumb } */
var pendImg = null;     /* 文字を読ませるための元画像 */
var pendCand = [];      /* 読み取った文字の候補 */
var touched = {};       /* 人が手で直した欄は、読み直しても上書きしない */
var SF = ['name','kana','company','dept','title','tel','mobile','email','url','addr','where','memo'];

function recentWheres(n){
  var seen = {}, out = [];
  var sorted = db.cards.slice().sort(function(a, b){ return b.ts - a.ts; });
  for (var i = 0; i < sorted.length && out.length < n; i++){
    var w = trim(sorted[i].where);
    if (w && !seen[w]){ seen[w] = 1; out.push(w); }
  }
  return out;
}
function saveSheetHtml(){
  var wh = recentWheres(5).map(function(w){
    return '<button class="chip" data-w="' + esc(w) + '">' + esc(w) + '</button>'; }).join('');
  return '<h2>新しい名刺</h2>' +
    '<p class="lead" id="s-lead">写真から文字を読んでいます。ちがうところは直せます。</p>' +
    '<button class="pic-big" id="s-pic"><img id="s-img" alt="いま撮った名刺"></button>' +
    '<div class="bar" id="s-bar"><i style="width:6%"></i></div>' +
    '<p class="reading" id="s-read">準備しています…</p>' +
    '<div id="s-err"></div>' +
    '<label for="s-name">名前</label>' +
    '<input type="text" class="name-in" id="s-name" placeholder="読めなければ手で入れる" autocomplete="off">' +
    '<div class="chips" id="s-cand-name"></div>' +
    '<label for="s-company">会社</label>' +
    '<input type="text" id="s-company" autocomplete="off">' +
    '<div class="chips" id="s-cand-co"></div>' +
    '<details class="more" id="s-more"><summary>電話・メール・住所など<span class="got" id="s-got"></span></summary>' +
      '<div class="half"><div><label for="s-tel">電話</label><input type="tel" id="s-tel" autocomplete="off"></div>' +
      '<div><label for="s-mobile">携帯</label><input type="tel" id="s-mobile" autocomplete="off"></div></div>' +
      '<label for="s-email">メール</label><input type="email" id="s-email" autocomplete="off" inputmode="email">' +
      '<div class="half"><div><label for="s-dept">部署</label><input type="text" id="s-dept" autocomplete="off"></div>' +
      '<div><label for="s-title">役職</label><input type="text" id="s-title" autocomplete="off"></div></div>' +
      '<label for="s-addr">住所</label><input type="text" id="s-addr" autocomplete="off">' +
      '<label for="s-url">サイト</label><input type="text" id="s-url" autocomplete="off">' +
      '<label for="s-kana">よみ</label><input type="text" id="s-kana" autocomplete="off">' +
    '</details>' +
    '<label for="s-where">どこで会った</label>' +
    (wh ? '<div class="chips" id="s-where-chips">' + wh + '</div>' : '') +
    '<input type="text" id="s-where" placeholder="例: 東京ビッグサイトの展示会" autocomplete="off">' +
    '<label for="s-memo">ひとことメモ</label>' +
    '<textarea id="s-memo" placeholder="例: 白髪でめがね。倉庫の件で見積がほしいとのこと。"></textarea>' +
    '<button class="btn primary" id="s-save">名刺箱にしまう</button>' +
    '<div class="row"><button class="btn" id="s-rot">回して読み直す</button>' +
    '<button class="btn danger" id="s-cancel">やめる</button></div>';
}
function setCands(){
  var h = pendCand.map(function(t){
    return '<button class="chip" data-v="' + esc(t) + '">' + esc(t) + '</button>'; }).join('');
  if (!$('s-cand-name')) return;
  $('s-cand-name').innerHTML = h;
  $('s-cand-co').innerHTML = h;
}
function fillFrom(got){
  var n = 0;
  SF.forEach(function(k){
    var el = $('s-' + k);
    if (!el || touched[k] || !got[k]) return;
    el.value = got[k];
  });
  ['tel','mobile','email','dept','title','addr','url','kana'].forEach(function(k){
    if ($('s-' + k) && trim($('s-' + k).value)) n++;
  });
  $('s-got').textContent = n ? '（' + n + '件 入りました）' : '';
  if (n && !$('s-more').open) $('s-more').open = false;
}
function ocrProgress(m){
  var bar = $('s-bar'), rd = $('s-read');
  if (!bar || !rd) return;
  var names = {
    'loading tesseract core':'文字を読む部品を用意しています',
    'loading language traineddata':'日本語の辞書を取り込んでいます（初回だけ）',
    'initializing tesseract':'準備しています',
    'initializing api':'準備しています',
    'recognizing text':'文字を読んでいます'
  };
  var pct = Math.max(4, Math.round((m.progress || 0) * 100));
  bar.firstChild.style.width = (m.status === 'recognizing text' ? pct : Math.min(40, pct)) + '%';
  rd.textContent = (names[m.status] || '準備しています') + '　' + pct + '%';
}
function runOcr(img){
  if ($('s-bar')) { $('s-bar').hidden = false; $('s-read').hidden = false; $('s-err').innerHTML = ''; }
  readCard(img, ocrProgress).then(function(lines){
    if (!$('s-name')) return;
    $('s-bar').hidden = true;
    pendCand = candidates(lines);
    setCands();
    var got = parseCard(lines);
    fillFrom(got);
    var any = got.name || got.company || got.tel || got.email;
    $('s-read').textContent = any ? '読めた。ちがうところは直す。' : '文字をうまく読めなかった。手で入れる。';
    $('s-lead').textContent = any ? '押すだけで直せる候補を、欄の下に並べてある。' : '写真は残るので、名前だけ入れておけばよい。';
  }, function(err){
    if (!$('s-read')) return;
    $('s-bar').hidden = true;
    $('s-read').hidden = true;
    $('s-err').innerHTML = '<div class="warn">文字を読む部品を取り込めなかった。' +
      '初めて使うときは電波のあるところで開く必要がある。<br>' +
      '写真は残るので、名前だけ手で入れてしまってよい。</div>';
  });
}
function openSave(){
  touched = {}; pendCand = [];
  openSheet(saveSheetHtml(), function(){
    $('s-img').src = pend.full;
    $('s-pic').addEventListener('click', function(){ showBig(pend.full); });
    SF.forEach(function(k){
      var el = $('s-' + k);
      if (el) el.addEventListener('input', function(){ touched[k] = 1; });
    });
    $('s-cand-name').addEventListener('click', function(ev){ pickCand(ev, 's-name', 'name'); });
    $('s-cand-co').addEventListener('click', function(ev){ pickCand(ev, 's-company', 'company'); });
    if ($('s-where-chips')) $('s-where-chips').addEventListener('click', function(ev){
      var b = ev.target.closest ? ev.target.closest('.chip') : null;
      if (!b) return;
      $('s-where').value = b.getAttribute('data-w');
      touched.where = 1;
    });
    $('s-rot').addEventListener('click', rotateAndRead);
    $('s-save').addEventListener('click', doSave);
    $('s-cancel').addEventListener('click', function(){
      if (!confirm('この名刺をやめますか？　写真も残りません。')) return;
      pend = null; pendImg = null; closeSheet();

/* ===================== 連絡先ファイル（vCard） ===================== */
function ve(s){
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}
function foldB64(prefix, b64){
  var out = prefix + b64.slice(0, Math.max(0, 72 - prefix.length));
  var rest = b64.slice(Math.max(0, 72 - prefix.length));
  while (rest.length){ out += '\r\n ' + rest.slice(0, 71); rest = rest.slice(71); }
  return out;
}
function vcard(c, photo){
  var L = ['BEGIN:VCARD', 'VERSION:3.0'];
  var nm = trim(c.name) || trim(c.company) || '名刺';
  var p = nm.split(/[\s　]+/);
  L.push('N:' + ve(p[0] || nm) + ';' + ve(p.slice(1).join(' ')) + ';;;');
  L.push('FN:' + ve(nm));
  if (trim(c.kana)){
    var k = trim(c.kana).split(/[\s　]+/);
    L.push('X-PHONETIC-LAST-NAME:' + ve(k[0] || ''));
    if (k.length > 1) L.push('X-PHONETIC-FIRST-NAME:' + ve(k.slice(1).join(' ')));
  }
  if (trim(c.company) || trim(c.dept)) L.push('ORG:' + ve(c.company) + ';' + ve(c.dept));
  if (trim(c.title))  L.push('TITLE:' + ve(c.title));
  if (trim(c.tel))    L.push('TEL;TYPE=WORK,VOICE:' + ve(c.tel));
  if (trim(c.mobile)) L.push('TEL;TYPE=CELL,VOICE:' + ve(c.mobile));
  if (trim(c.email))  L.push('EMAIL;TYPE=INTERNET,WORK:' + ve(c.email));
  if (trim(c.url))    L.push('URL:' + ve(siteUrl(c.url)));
  if (trim(c.addr))   L.push('ADR;TYPE=WORK:;;' + ve(c.addr) + ';;;;');
  var note = [];
  if (c.met) note.push('会った日 ' + c.met + (trim(c.where) ? '（' + trim(c.where) + '）' : ''));
  else if (trim(c.where)) note.push('どこで ' + trim(c.where));
  if (trim(c.memo)) note.push(trim(c.memo));
  if (note.length) L.push('NOTE:' + ve(note.join('\n')));
  var body = L.join('\r\n');
  if (photo){
    var i = photo.indexOf(',');
    if (i > 0) body += '\r\n' + foldB64('PHOTO;ENCODING=b;TYPE=JPEG:', photo.slice(i + 1));
  }
  return body + '\r\nEND:VCARD\r\n';
}
function safeName(s){ return String(s || '名刺').replace(/[\\\/:*?"<>|]/g, '_').slice(0, 40); }
function saveVcf(c){
  if (!c.shot){ saveFile(safeName(fullName(c)) + '.vcf', vcard(c, null), 'text/vcard;charset=utf-8'); return; }

    busy(false);

}

function buildCSV(){
  var rows = [['名前','よみ','会社','部署','役職','電話','携帯','メール','サイト','住所','会った日','どこで','メモ','しまった日']];
  db.cards.forEach(function(c){
    rows.push([trim(c.name), trim(c.kana), trim(c.company), trim(c.dept), trim(c.title),
      trim(c.tel), trim(c.mobile), trim(c.email), trim(c.url), trim(c.addr),
      c.met || '', trim(c.where), trim(c.memo), ymd(new Date(c.ts))]);
  });
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v == null ? '' : v);
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',');
  }).join('\r\n');
}

/* ===================== 書き出し・コピー ===================== */
var savePromise = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads')['catch'](function(){ return null; }) : null;
function copyText(text, okMsg){
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    toast(ok ? okMsg : 'コピーできませんでした');
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  else fallback();
}
function saveFile(name, data, mime){
  if (savePromise){
    toast('保存を準備しています…');
    savePromise.then(function(dl){
      if (!dl || !dl.save){ toast('この画面ではファイル保存を使えません'); return; }
      dl.save({ filename:name, data:data }).then(function(){ toast('保存しました'); }, function(err){
        if (err && err.code === 'declined') return;
        toast('保存できませんでした');
      });
    });
    return;
  }
  try {
    var url = URL.createObjectURL(new Blob([data], { type:mime }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    toast('保存しました');
  } catch(e){ toast('保存できませんでした'); }
}

function doBackup(withPhotos){
  var base = { app:'meishibako', v:2, at:new Date().toISOString(), cards:db.cards };
  if (!withPhotos){
    saveFile('めいしばこ_バックアップ_文字だけ_' + today() + '.json', JSON.stringify(base), 'application/json');
    return;
  }
  busy(true, '写真をまとめています…');
  IDB.all().then(function(rows){
    busy(false);
    base.shots = (rows || []).filter(function(r){ return r && r.id && r.id.indexOf('__') !== 0; });
    saveFile('めいしばこ_バックアップ_' + today() + '.json', JSON.stringify(base), 'application/json');
  }, function(){ busy(false); toast('写真を読み出せませんでした'); });
}
function doRestore(file){
  var r = new FileReader();
  r.onload = function(){
    var raw = null;
    try { raw = JSON.parse(String(r.result)); } catch(e){}
    if (!raw || !Array.isArray(raw.cards)){ toast('このファイルは読めませんでした'); return; }
    var ns = (raw.shots || []).length;
    if (!confirm('名刺 ' + raw.cards.length + '枚' + (ns ? '（写真 ' + ns + '枚）' : '（写真なし）') +
      ' を読み込みます。いまの記録は置きかわります。よろしいですか？')) return;
    db.cards = raw.cards;
    db.cards.forEach(function(c){ if (!c.id) c.id = uid(); if (!c.ts) c.ts = Date.now(); });
    persist();
    thumbCache = {};
    busy(true, '写真をもどしています…');
    IDB.clear().then(function(){
      var chain = Promise.resolve();
      (raw.shots || []).forEach(function(s){
        if (!s || !s.id) return;
        chain = chain.then(function(){ return IDB.put({ id:s.id, full:s.full, thumb:s.thumb }); });
      });
      return chain;
    }).then(function(){
      busy(false); renderGrid(); closeSheet(); toast('もどしました');
    }, function(){
      busy(false); renderGrid(); closeSheet(); toast('文字はもどったが、写真はもどせなかった');
    });
  };
  r.onerror = function(){ toast('ファイルを読めませんでした'); };
  r.readAsText(file);
}

    { name:'田中 みどり', kana:'たなか みどり', company:'みどり印刷有限会社', title:'代表取締役',
      mobile:'080-5555-6666', email:'midori@midori-print.jp',
      addr:'〒460-0008 愛知県名古屋市中区栄3-2-1', where:'商工会の新年会', d:40,
      memo:'チラシと封筒はここに頼んでいる。小ロットも受けてくれる。' },
    { name:'高橋 学', kana:'たかはし まなぶ', company:'高橋建設株式会社', dept:'工務部', title:'部長',
      tel:'042-555-7777', where:'現場で紹介された', d:210,
      memo:'倉庫の改修の見積をもらったことがある。話が早い。' }
  ];
  var chain = Promise.resolve();
  S.forEach(function(s, i){
    var d = back(s.d); d.setHours(14, 20, 0, 0);
    var c = { id:uid() + i, ts:d.getTime(), shot:1, met:ymd(d) };
    F.forEach(function(k){ if (k !== 'met') c[k] = s[k] || ''; });
    db.cards.push(c);
    var sh = fakeShot(c.name, c.company, [c.dept, c.title].filter(Boolean).join(' '));
    chain = chain.then(function(){ return putShot(c.id, sh); });
  });
  db.cards.sort(function(a, b){ return b.ts - a.ts; });
  persist();
  chain.then(function(){ renderGrid(); closeSheet(); toast('サンプルを入れました'); });
}

  if (!$('viewer').hidden){ $('viewer').hidden = true; $('viewer-img').src = ''; }

});
renderGrid();
