<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7042">
<meta name="apple-mobile-web-app-title" content="めいしばこ">
<title>めいしばこ</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@600;900&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#f5f4ec; --card:#ffffff; --ink:#1b1d17; --sub:#6f7568; --rule:#e1e2d4; --field:#eef0e6;
  --key:#4f7042; --key-deep:#33502b; --key-soft:#e7efe1; --on-key:#ffffff;
  --ok:#3c7a4e; --mute:#868c7d;
  --shadow:0 1px 2px rgba(30,36,22,.05), 0 10px 30px rgba(30,36,22,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --ground:#131510; --card:#1d201a; --ink:#e8ebdf; --sub:#98a08d; --rule:#2f332a; --field:#171a14;
    --key:#8dba6f; --key-deep:#456b34; --key-soft:#1a2416; --on-key:#12200c;
    --ok:#7cc48f; --mute:#848b78;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.mincho{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif}

.wrap{max-width:620px;margin:0 auto;padding:0 16px calc(56px + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 2px 4px}
header h1{font-family:"Zen Old Mincho",serif;font-size:19px;font-weight:900;letter-spacing:.1em;margin:0}
header .n{font-size:12px;color:var(--sub);letter-spacing:.04em}
header .sp{flex:1}
.gear{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--sub);
  width:38px;height:38px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.gear:focus-visible{outline:2px solid var(--key);outline-offset:2px}

.shoot{display:block;width:100%;border:0;cursor:pointer;color:var(--on-key);border-radius:18px;
  padding:24px 18px;margin-top:12px;font:inherit;text-align:center;
  background:linear-gradient(165deg,var(--key),var(--key-deep));box-shadow:var(--shadow);
  -webkit-tap-highlight-color:transparent;transition:transform .09s ease, filter .15s ease}
.shoot:active{transform:scale(.985);filter:brightness(.93)}
.shoot:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.shoot b{display:block;font-size:23px;font-weight:900;letter-spacing:.16em;line-height:1.3}
.shoot span{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;opacity:.9;margin-top:3px}
.sub-act{display:block;width:100%;margin-top:8px;appearance:none;border:0;background:transparent;
  color:var(--sub);font:inherit;font-size:13px;font-weight:700;padding:6px;cursor:pointer;text-decoration:underline}

.find{position:relative;margin-top:18px}
.find input[type=search]{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:12px;padding:13px 14px 13px 42px;box-shadow:var(--shadow);-webkit-appearance:none}
.find input[type=search]:focus-visible{outline:2px solid var(--key);outline-offset:1px}
.find .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px;pointer-events:none}

.listhead{display:flex;align-items:center;gap:10px;margin:18px 2px 0}
.count{font-size:11.5px;color:var(--sub);letter-spacing:.08em;font-weight:700;flex:1}
.viewsw{display:flex;gap:3px;background:var(--field);border:1px solid var(--rule);border-radius:9px;padding:3px;flex:none}
.viewsw button{appearance:none;border:0;background:transparent;color:var(--sub);font:inherit;
  font-size:12px;font-weight:700;padding:5px 13px;border-radius:7px;cursor:pointer}
.viewsw button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(30,36,22,.12)}
.viewsw button:focus-visible{outline:2px solid var(--key);outline-offset:2px}

/* 文字で見る一覧。メモまで出るので、ぱっと見て思い出せる */
.listwrap{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  box-shadow:var(--shadow);padding:0 13px;margin-top:9px}
.lrow{display:flex;gap:11px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);
  background:transparent;border:0;border-top:1px solid var(--rule);padding:11px 0;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow:focus-visible{outline:2px solid var(--key);outline-offset:-2px}
.lth{flex:none;width:54px;height:33px;border-radius:5px;object-fit:cover;display:block;
  background:var(--field);border:1px solid var(--rule)}
.lth.no{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--mute);
  font-weight:700;letter-spacing:.02em}
.lbody{flex:1;min-width:0}
.lnm{font-family:"Zen Old Mincho",serif;font-size:15.5px;font-weight:700;line-height:1.4;word-break:break-word}
.lco{font-family:"Zen Kaku Gothic New",sans-serif;font-size:11.5px;font-weight:700;color:var(--sub);margin-left:7px}
.lmemo,.lmeta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmemo{font-size:12.5px;color:var(--ink);line-height:1.55;margin-top:1px}
.lmeta{font-size:11px;color:var(--sub);line-height:1.5}
.lrow .chev{flex:none;color:var(--sub);font-size:19px;line-height:1}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:9px}
@media (min-width:520px){ .grid{grid-template-columns:1fr 1fr 1fr} }
.tile{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.tile:focus-visible{outline:2px solid var(--key);outline-offset:3px;border-radius:12px}
.tile .pic{aspect-ratio:91/55;border-radius:11px;overflow:hidden;background:var(--field);
  border:1px solid var(--rule);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pic .no{font-size:10.5px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.tile .nm{font-family:"Zen Old Mincho",serif;font-size:15.5px;font-weight:700;line-height:1.45;margin-top:8px;word-break:break-word}
.tile .co{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:1px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.empty{color:var(--sub);font-size:13.5px;text-align:center;padding:34px 14px;line-height:2.1}
.empty b{color:var(--ink)}

/* ===== 下から出る画面 ===== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--card);width:100%;max-width:620px;max-height:94vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet h2{font-family:"Zen Old Mincho",serif;margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:.05em;word-break:break-word}
.sheet .lead{font-size:13px;color:var(--sub);margin:5px 0 0;word-break:break-word}

.pic-big{display:block;width:100%;padding:0;border:1px solid var(--rule);border-radius:13px;overflow:hidden;
  background:#0c0b0a;margin-top:14px;cursor:zoom-in}
.pic-big img{width:100%;display:block}
.spot{margin:8px 0 4px;padding:9px 11px;border:1px solid var(--rule);border-radius:11px;background:var(--card)}
.spot .spot-t{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:6px;word-break:break-all}
.spot .chips{margin-top:0}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.1em;margin:17px 0 6px}
input[type=text],input[type=date],input[type=tel],input[type=email],input[type=search],textarea,select{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:10px;padding:12px 13px;-webkit-appearance:none}
textarea{line-height:1.75;resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--key);outline-offset:1px}
.name-in{font-family:"Zen Old Mincho",serif;font-size:21px !important;font-weight:700}
.half{display:flex;gap:10px}
.half>div{flex:1;min-width:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 1px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--sub);font:inherit;
  font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--key);border-color:var(--key);color:var(--on-key)}
.chip:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.cap{font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.08em;margin:11px 2px 0}

details.more{margin-top:16px;border-top:1px solid var(--rule);padding-top:4px}
details.more>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--key);
  letter-spacing:.05em;padding:11px 2px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"＋ ";font-weight:900}
details.more[open]>summary::before{content:"− "}
details.more>summary .got{color:var(--ok);font-size:11.5px;margin-left:6px}

.btn{appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;
  font-weight:700;letter-spacing:.04em;border-radius:11px;padding:13px 14px;cursor:pointer;width:100%;margin-top:10px}
.btn:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.btn.primary{background:var(--key);border-color:var(--key);color:var(--on-key);font-size:16px;padding:15px}
.btn.danger{color:var(--key);border-color:var(--key)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px}

.facts{margin:16px 0 0;border-top:1px solid var(--rule)}
.facts .f{display:flex;gap:12px;border-bottom:1px solid var(--rule);padding:11px 2px;align-items:baseline}
.facts .k{flex:none;width:70px;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:.06em}
.facts .v{flex:1;min-width:0;font-size:15px;word-break:break-word;white-space:pre-wrap}
.facts .v a{color:var(--key);font-weight:700;text-decoration:none;border-bottom:1px solid var(--key)}

.bar{height:7px;background:var(--field);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--key);border-radius:99px;transition:width .3s ease}
.reading{font-size:13px;color:var(--sub);margin:9px 2px 0;font-weight:700}
.warn{font-size:12.5px;color:var(--key);background:var(--key-soft);border:1px solid var(--key);
  border-radius:11px;padding:11px 13px;margin-top:12px;line-height:1.75}

.opt{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:0}
.opt input{width:21px;height:21px;flex:none;accent-color:var(--key)}
.hint{font-size:11.5px;color:var(--sub);line-height:1.85;margin:8px 2px 0}
.credit{font-size:10.5px;color:var(--sub);text-align:center;letter-spacing:.03em;margin:30px 0 0;opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;background:var(--ink);color:var(--ground);
  font-size:14px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);max-width:88vw;text-align:center}
/* ===== その場のカメラ（枠に合わせて撮る。シャッター音は鳴らない） ===== */
.cam{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.cam .top{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:#000}
.cam .top button{appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
  color:#fff;font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
.cam .top .sp{flex:1}
.cam .stage{position:relative;flex:1;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .box{position:absolute;left:6%;width:88%;aspect-ratio:91/55;top:50%;transform:translateY(-50%);
  border:2px solid rgba(255,255,255,.92);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.cam .tip{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-size:13px;
  font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
.cam .ctl{display:flex;align-items:center;gap:12px;padding:16px 18px calc(20px + env(safe-area-inset-bottom));background:#000}
.cam .ctl .side{flex:1;color:#fff;font:inherit;font-size:12.5px;font-weight:700;background:transparent;
  border:0;cursor:pointer;text-decoration:underline;opacity:.85}
.shutter{flex:none;width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.3);
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutter:active{transform:scale(.94)}
.cam .err{color:#fff;font-size:13.5px;line-height:1.9;padding:26px 22px;text-align:center}

/* ===== 切り直し（四隅を動かす） ===== */
.cropbox{position:relative;margin-top:14px;border-radius:11px;overflow:hidden;background:#0c0b0a;touch-action:none}
.cropbox img{width:100%;display:block}
.cropbox svg{position:absolute;inset:0;width:100%;height:100%}

.busy{position:fixed;inset:0;z-index:90;background:rgba(20,14,10,.45);display:flex;align-items:center;justify-content:center}
.busy span{background:var(--card);color:var(--ink);font-size:14px;font-weight:700;padding:15px 24px;border-radius:13px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>めいしばこ</h1>
    <span class="n" id="hdn"></span>
    <span class="sp"></span>
    <button class="gear" id="btn-gear" aria-label="設定">⚙</button>
  </header>

  <button class="shoot" id="btn-shoot">
    <b>名刺を撮る</b>
    <span>撮ると、名前や電話を自分で読みとります</span>
  </button>
  <button class="sub-act" id="btn-pick">写真から選ぶ</button>
  <input type="file" id="file-cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-pick" accept="image/*" hidden>

  <div class="find">
    <span class="mag">🔍</span>
    <input type="search" id="q" placeholder="名前・会社・場所・メモ　どれでも" autocomplete="off">
  </div>

  <div class="listhead" id="listhead" hidden>
    <span class="count" id="count"></span>
    <div class="viewsw" id="viewsw">
      <button data-v="grid" aria-pressed="true">写真</button>
      <button data-v="list" aria-pressed="false">一覧</button>
    </div>
  </div>
  <div id="cards"></div>
  <div id="none" hidden></div>

  <p class="credit">写真も記録もこの端末の中だけ。文字を読むのも端末の中で行います。</p>
</div>

<div class="cam" id="cam" hidden>
  <div class="top">
    <button id="cam-close">閉じる</button>
    <span class="sp"></span>
    <button id="cam-torch" hidden>ライト</button>
  </div>
  <div class="stage" id="cam-stage">
    <video id="cam-video" playsinline muted autoplay></video>
    <div class="box" id="cam-box"></div>
    <p class="tip">枠に名刺を合わせる。まわりの机が入っても切り取ります</p>
  </div>
  <div class="ctl">
    <button class="side" id="cam-pick">写真から選ぶ</button>
    <button class="shutter" id="cam-shot" aria-label="撮る"></button>
    <span class="side"></span>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="viewer" id="viewer" hidden><img id="viewer-img" alt="名刺"></div>

<script>
(function(){
'use strict';

/* ===================== 文字を読む部品の置き場所 =====================
   ふだんは CDN から取ってくる。自分で置きたいときは ?ocr=（置いた場所）を付けて開く。
   置き場所には tesseract.min.js / worker.min.js / core/ / lang/ を入れておく。      */
var OCRBASE = (function(){
  var m = location.search.match(/[?&]ocr=([^&]+)/);
  return m ? decodeURIComponent(m[1]).replace(/\/$/, '') : '';
})();
var OCR = OCRBASE ? {
  lib:    OCRBASE + '/tesseract.min.js',
  worker: OCRBASE + '/worker.min.js',
  core:   OCRBASE + '/core',
  lang:   OCRBASE + '/lang'
} : {
  lib:    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  lang:   'https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int'
};

/* ===================== 保存（端末内のみ） ===================== */
var KEY = 'meishi.v1';
var db = { cards:[], mail:'' };
(function load(){
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if (raw && typeof raw === 'object'){
    db.cards = Array.isArray(raw.cards) ? raw.cards : [];
    db.mail  = typeof raw.mail === 'string' ? raw.mail : '';
  }
  for (var i = 0; i < db.cards.length; i++){
    var c = db.cards[i];
    if (!c.id) c.id = uid();
    if (!c.ts) c.ts = Date.now();
  }
})();
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('保存できませんでした。端末の空き容量を確認してください'); }
}

/* 名刺の写真は大きいので IndexedDB に置く */
var IDB = (function(){
  var dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if (!window.indexedDB){ rej(new Error('indexedDB なし')); return; }
      var rq = indexedDB.open('meishi', 1);
      rq.onupgradeneeded = function(){
        var d = rq.result;
        if (!d.objectStoreNames.contains('shots')) d.createObjectStore('shots', { keyPath:'id' });
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror   = function(){ rej(rq.error); };
    });
    return dbp;
  }
  function work(mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction('shots', mode), rq = fn(t.objectStore('shots'));
        t.oncomplete = function(){ res(rq ? rq.result : null); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    get:   function(id){ return work('readonly',  function(s){ return s.get(id); }); },
    put:   function(o){  return work('readwrite', function(s){ return s.put(o); }); },
    del:   function(id){ return work('readwrite', function(s){ return s.delete(id); }); },
    all:   function(){   return work('readonly',  function(s){ return s.getAll ? s.getAll() : null; }); },
    clear: function(){   return work('readwrite', function(s){ return s.clear(); }); }
  };
})();
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }

/* ===================== 小道具 ===================== */
var $ = function(id){ return document.getElementById(id); };
var WD = ['日','月','火','水','木','金','土'];
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function two(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function trim(s){ return String(s == null ? '' : s).trim(); }

    for (var k = 0; k < heads.length; k++){         /* 肩書き・部署のすぐ下なら強く */

    if (!got.email){ var e = pickEmail(L.t); if (e){ got.email = e; used[i] = 1; } }
  });
  lines.forEach(function(L, i){

  });

  var residual = {}, heads = [];

    var rest = [], hit = false;

      else if (!got.dept && (RE_DEPT.test(w) || RE_DEPT2.test(w)) && w.length <= 12){ got.dept = w; hit = true; }

function tidyCompany(t){

    if (wd.length >= 3 && /(都|道|府|県|市|区|町|村|丁目|番地|ビル|階|号)$/.test(wd)) break;

function tidyName(t){

    chain = chain.then(function(){
      var h = L.h;
      var beyond = col && (L.bb.x0 < col.x0 - h || L.bb.x1 > col.x1 + h);
      if (L.c >= 45 && !beyond) return;                     /* よく読めていて列にも収まっている行はそのまま */
      var bx0 = col ? Math.max(L.bb.x0, col.x0 - h * 0.4) : L.bb.x0;
      var bx1 = col ? Math.min(L.bb.x1, col.x1 + h * 0.4) : L.bb.x1;
      if (bx1 - bx0 < h) return;
      var bb = { x0:bx0, x1:bx1, y0:L.bb.y0, y1:L.bb.y1 };

  if (!r.width || !r.height) return;
  var fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
  var cv = lastOcr.cv, x = fx * cv.width, y = fy * cv.height, hit = null;
  lastOcr.lines.forEach(function(L){
    if (!L.bb) return;
    var pad = L.h * 0.3;
    if (x >= L.bb.x0 - pad && x <= L.bb.x1 + pad && y >= L.bb.y0 - pad && y <= L.bb.y1 + pad){
      if (!hit || L.h < hit.h) hit = L;
    }
  });
  var bb;
  if (hit){
    bb = { x0:hit.bb.x0, x1:hit.bb.x1, y0:hit.bb.y0, y1:hit.bb.y1 };
    /* 行がやたら横に長いときは、押したところを中心に、本文の列の幅で切る */
    if (lastOcr.col && (bb.x1 - bb.x0) > (lastOcr.col.x1 - lastOcr.col.x0) * 1.3){
      bb.x0 = Math.max(bb.x0, lastOcr.col.x0 - hit.h * 0.4); bb.x1 = Math.min(bb.x1, lastOcr.col.x1 + hit.h * 0.4);

    bb = { x0: lastOcr.col ? lastOcr.col.x0 : 0, x1: lastOcr.col ? lastOcr.col.x1 : cv.width,

  }

    if (alt && alt.t && (!best || alt.c > best.c)) best = alt;
    return rereadLine(lastOcr.w, cv, bb, '7', 200);
  }).then(function(alt){
    if (alt && alt.t && (!best || alt.c > best.c)) best = alt;
    busy(false);
    var t = best && best.t ? best.t.replace(/^[\s　|｜\[\]!:;・.,、。]+/, '').trim() : '';

  var x = f.x*c.width, y = f.y*c.height, w = f.w*c.width, h = f.h*c.height;
  return [[x,y], [x+w,y], [x+w,y+h], [x,y+h]];
}
/* hint … カメラの枠（画面に対する割合）。名刺を見つけられなかったときはここで切る */
function processRaw(raw, hint){
  busy(true, '名刺を切り出しています…');
  setTimeout(function(){
    try {
      pendRaw = raw; pendOrient = 0; pendOriented = false;
      var qd = findQuad(raw);
      pendCropped = !!qd;
      if (!qd && hint){ qd = fracQuad(raw, hint); pendCropped = true; }
      pendQuad = qd || fullQuad(raw);
      buildPend();
    } catch(e){ busy(false); toast('写真を扱えませんでした'); return; }
    busy(false);
    if (checkCrop){ openRecrop(); return; }
    openSave();
    runOcr(pendCard);
  }, 30);
}
function rotateAndRead(){
  if (!pendRaw) return;

    pendOrient = (pendOrient + 90) % 360; pendOriented = true;
    buildPend();

}
function startCapture(file){
  if (!file) return;

  readImage(file, function(im){

/* ===== 切り直し：四隅を手で合わせる ===== */
function openRecrop(){
  if (!pendRaw) return;
  var keep = $('s-name') ? grabForm() : null;
  var W = pendRaw.width, H = pendRaw.height;
  var url = toCanvas(pendRaw, 1100).toDataURL('image/jpeg', 0.82);
  var q = pendQuad.map(function(pp){ return [pp[0], pp[1]]; });
  var rr = Math.max(9, W/55), sw = Math.max(2, W/280);
  var h = '<h2>四隅を合わせる</h2>' +
    '<p class="lead">白い丸をつまんで、名刺の角に置く。合わせたら読み直す。</p>' +
    '<div class="cropbox" id="cb"><img src="' + url + '" alt="撮った写真">' +
    '<svg id="cb-svg" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<polygon id="cb-poly" fill="rgba(120,200,120,.16)" stroke="#fff" stroke-width="' + sw + '"></polygon>' +
    '<g id="cb-dots"></g></svg></div>' +
    '<button class="btn primary" id="cb-ok">これで読み直す</button>' +
    '<div class="row"><button class="btn" id="cb-all">写真ぜんぶを使う</button>' +
    '<button class="btn" id="cb-cancel">やめる</button></div>';
  openSheet(h, function(){
    var svg = $('cb-svg'), poly = $('cb-poly'), dots = $('cb-dots'), active = -1;
    function draw(){
      poly.setAttribute('points', q.map(function(pp){ return pp[0] + ',' + pp[1]; }).join(' '));
      var g = '';
      for (var i = 0; i < 4; i++)
        g += '<circle cx="' + q[i][0] + '" cy="' + q[i][1] + '" r="' + rr +
             '" fill="#fff" stroke="#3a6b34" stroke-width="' + sw + '"></circle>';
      dots.innerHTML = g;
    }
    function at(ev){
      var r = svg.getBoundingClientRect();
      return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H];
    }
    function put(pnt){
      q[active] = [Math.max(0, Math.min(W, pnt[0])), Math.max(0, Math.min(H, pnt[1]))];
      draw();
    }
    svg.addEventListener('pointerdown', function(ev){
      var pnt = at(ev), bi = 0, bd = 1e18;
      for (var i = 0; i < 4; i++){
        var d = (q[i][0]-pnt[0])*(q[i][0]-pnt[0]) + (q[i][1]-pnt[1])*(q[i][1]-pnt[1]);
        if (d < bd){ bd = d; bi = i; }
      }
      active = bi; put(pnt); ev.preventDefault();
    });
    svg.addEventListener('pointermove', function(ev){
      if (active < 0) return;
      put(at(ev)); ev.preventDefault();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){
      svg.addEventListener(t, function(){ active = -1; });
    });
    draw();
    function apply(qd){
      pendQuad = qd; pendCropped = true;
      busy(true, '切り出しています…');
      setTimeout(function(){
        buildPend(); busy(false); openSave(keep); runOcr(pendCard);
      }, 30);
    }
    $('cb-ok').addEventListener('click', function(){ apply(q); });
    $('cb-all').addEventListener('click', function(){ apply(fullQuad(pendRaw)); });
    $('cb-cancel').addEventListener('click', function(){
      if (keep){ openSave(keep); return; }
      apply(pendQuad);   /* 撮った直後なら、このまま読みに進む */
    });
  });
}

/* ===== アプリの中のカメラ（シャッター音は鳴らない） ===== */
var camStream = null, camTrack = null, torchOn = false;
function openCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('file-cam').click(); return; }
  $('cam').hidden = false;
  document.body.style.overflow = 'hidden';
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } },
    audio: false
  }).then(function(st){
    camStream = st;
    camTrack = st.getVideoTracks()[0];
    var v = $('cam-video');
    v.srcObject = st;
    var pl = v.play();
    if (pl && pl['catch']) pl['catch'](function(){});
    try {
      if (camTrack.applyConstraints)
        camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] })['catch'](function(){});
      var cap = camTrack.getCapabilities ? camTrack.getCapabilities() : null;
      $('cam-torch').hidden = !(cap && cap.torch);
    } catch(e){}
  }, function(){
    closeCamera();
    toast('カメラを使えませんでした。写真から選んでください');
    $('file-pick').click();
  });
}
function closeCamera(){
  $('cam').hidden = true;
  document.body.style.overflow = '';
  if (camStream){
    camStream.getTracks().forEach(function(t){ try { t.stop(); } catch(e){} });
    camStream = null; camTrack = null;
  }
  try { $('cam-video').srcObject = null; } catch(e){}
  torchOn = false;
}
/* 画面に出している枠が、写真のどこにあたるかを割合で返す（object-fit:cover の分を戻す） */
function guideFrac(){
  var v = $('cam-video'), bx = $('cam-box');
  if (!v || !bx || !v.videoWidth) return null;
  var vr = v.getBoundingClientRect(), br = bx.getBoundingClientRect();
  if (!vr.width || !vr.height || !br.width) return null;
  var sc = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
  var ox = vr.left + (vr.width - v.videoWidth*sc) / 2;
  var oy = vr.top + (vr.height - v.videoHeight*sc) / 2;
  var x = (br.left - ox)/sc, y = (br.top - oy)/sc, w = br.width/sc, h = br.height/sc;
  x -= w*0.04; y -= h*0.06; w *= 1.08; h *= 1.12;      /* 少し広めに取る */
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(v.videoWidth - x, w); h = Math.min(v.videoHeight - y, h);
  if (w < 40 || h < 40) return null;
  return { x:x/v.videoWidth, y:y/v.videoHeight, w:w/v.videoWidth, h:h/v.videoHeight };
}
function camCapture(){
  var v = $('cam-video');
  if (!v.videoWidth){ toast('もう少し待ってから押す'); return; }
  var hint = guideFrac();
  var c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  closeCamera();
  processRaw(toCanvas(c, 2400), hint);
}

/* ===================== 連絡先ファイル（vCard） ===================== */
function ve(s){
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}
function foldB64(prefix, b64){
  var out = prefix + b64.slice(0, Math.max(0, 72 - prefix.length));
  var rest = b64.slice(Math.max(0, 72 - prefix.length));
  while (rest.length){ out += '\r\n ' + rest.slice(0, 71); rest = rest.slice(71); }
  return out;
}
function vcard(c, photo){
  var L = ['BEGIN:VCARD', 'VERSION:3.0'];
  var nm = trim(c.name) || trim(c.company) || '名刺';
  var p = nm.split(/[\s　]+/);
  L.push('N:' + ve(p[0] || nm) + ';' + ve(p.slice(1).join(' ')) + ';;;');
  L.push('FN:' + ve(nm));
  if (trim(c.kana)){
    var k = trim(c.kana).split(/[\s　]+/);
    L.push('X-PHONETIC-LAST-NAME:' + ve(k[0] || ''));
    if (k.length > 1) L.push('X-PHONETIC-FIRST-NAME:' + ve(k.slice(1).join(' ')));
  }
  if (trim(c.company) || trim(c.dept)) L.push('ORG:' + ve(c.company) + ';' + ve(c.dept));
  if (trim(c.title))  L.push('TITLE:' + ve(c.title));
  if (trim(c.tel))    L.push('TEL;TYPE=WORK,VOICE:' + ve(c.tel));
  if (trim(c.mobile)) L.push('TEL;TYPE=CELL,VOICE:' + ve(c.mobile));
  if (trim(c.email))  L.push('EMAIL;TYPE=INTERNET,WORK:' + ve(c.email));
  if (trim(c.url))    L.push('URL:' + ve(siteUrl(c.url)));
  if (trim(c.addr))   L.push('ADR;TYPE=WORK:;;' + ve(c.addr) + ';;;;');
  var note = [];
  if (c.met) note.push('会った日 ' + c.met + (trim(c.where) ? '（' + trim(c.where) + '）' : ''));
  else if (trim(c.where)) note.push('どこで ' + trim(c.where));
  if (trim(c.memo)) note.push(trim(c.memo));
  if (note.length) L.push('NOTE:' + ve(note.join('\n')));
  var body = L.join('\r\n');
  if (photo){
    var i = photo.indexOf(',');
    if (i > 0) body += '\r\n' + foldB64('PHOTO;ENCODING=b;TYPE=JPEG:', photo.slice(i + 1));
  }
  return body + '\r\nEND:VCARD\r\n';
}
function safeName(s){ return String(s || '名刺').replace(/[\\\/:*?"<>|]/g, '_').slice(0, 40); }
function saveVcf(c){
  if (!c.shot){ saveFile(safeName(fullName(c)) + '.vcf', vcard(c, null), 'text/vcard;charset=utf-8'); return; }
  busy(true, '書き出しています…');
  getShot(c.id).then(function(s){
    busy(false);
    saveFile(safeName(fullName(c)) + '.vcf', vcard(c, s && s.full), 'text/vcard;charset=utf-8');
  });
}

/* ===================== CSV ===================== */
function buildCSV(){
  var rows = [['名前','よみ','会社','部署','役職','電話','携帯','メール','サイト','住所','会った日','どこで','メモ','しまった日']];
  db.cards.forEach(function(c){
    rows.push([trim(c.name), trim(c.kana), trim(c.company), trim(c.dept), trim(c.title),
      trim(c.tel), trim(c.mobile), trim(c.email), trim(c.url), trim(c.addr),
      c.met || '', trim(c.where), trim(c.memo), ymd(new Date(c.ts))]);
  });
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v == null ? '' : v);
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',');
  }).join('\r\n');
}

/* ===================== 書き出し・コピー ===================== */
var savePromise = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads')['catch'](function(){ return null; }) : null;
function copyText(text, okMsg){
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    toast(ok ? okMsg : 'コピーできませんでした');
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  else fallback();
}
function saveFile(name, data, mime){
  if (savePromise){
    toast('保存を準備しています…');
    savePromise.then(function(dl){
      if (!dl || !dl.save){ toast('この画面ではファイル保存を使えません'); return; }
      dl.save({ filename:name, data:data }).then(function(){ toast('保存しました'); }, function(err){
        if (err && err.code === 'declined') return;
        toast('保存できませんでした');
      });
    });
    return;
  }
  try {
    var url = URL.createObjectURL(new Blob([data], { type:mime }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    toast('保存しました');
  } catch(e){ toast('保存できませんでした'); }
}

      saveFile('めいしばこ_名簿_' + today() + '.csv', '﻿' + buildCSV(), 'text/csv;charset=utf-8;'); });
    $('g-bk-full').addEventListener('click', function(){ doBackup(true); });
    $('g-bk-lite').addEventListener('click', function(){ doBackup(false); });
    $('g-restore').addEventListener('change', function(){
      if (this.files && this.files[0]) doRestore(this.files[0]);
      this.value = '';
    });
    $('g-warm').addEventListener('click', function(){
      var st = $('g-warm-state');
      st.textContent = '取り込んでいます…';
      progressCb = function(m){
        if (!$('g-warm-state')) return;
        $('g-warm-state').textContent = m.status + '　' + Math.round((m.progress || 0) * 100) + '%';
      };
      getWorker().then(function(){
        progressCb = null;
        if ($('g-warm-state')) $('g-warm-state').textContent = '準備できた。次からは待たずに読める。';
      }, function(){
        progressCb = null;
        if ($('g-warm-state')) $('g-warm-state').textContent = '取り込めなかった。電波のあるところでもう一度。';
      });
    });
    $('g-check').checked = checkCrop;
    $('g-check').addEventListener('change', function(){
      checkCrop = this.checked;
      try { localStorage.setItem(CKEY, checkCrop ? '1' : '0'); } catch(e){}
    });
    $('g-sample').addEventListener('click', function(){
      if (db.cards.length){ toast('名刺があるときは入れられません'); return; }
      if (!confirm('動きを試すための架空の名刺を5枚入れます。よろしいですか？')) return;
      loadSample();
    });
    $('g-wipe').addEventListener('click', function(){
      if (!confirm('名刺も写真もすべて消えます。取り消せません。よろしいですか？')) return;
      if (!confirm('本当に削除しますか？')) return;
      db.cards = []; db.mail = '';
      persist(); thumbCache = {};
      IDB.clear()['catch'](function(){});
      renderCards(); closeSheet(); toast('すべて削除しました');
    });
    $('g-close').addEventListener('click', closeSheet);
  });
}

/* ===================== バックアップ ===================== */
function doBackup(withPhotos){
  var base = { app:'meishibako', v:2, at:new Date().toISOString(), cards:db.cards };
  if (!withPhotos){
    saveFile('めいしばこ_バックアップ_文字だけ_' + today() + '.json', JSON.stringify(base), 'application/json');
    return;
  }
  busy(true, '写真をまとめています…');
  IDB.all().then(function(rows){
    busy(false);
    base.shots = (rows || []).filter(function(r){ return r && r.id && r.id.indexOf('__') !== 0; });
    saveFile('めいしばこ_バックアップ_' + today() + '.json', JSON.stringify(base), 'application/json');
  }, function(){ busy(false); toast('写真を読み出せませんでした'); });
}
function doRestore(file){
  var r = new FileReader();
  r.onload = function(){
    var raw = null;
    try { raw = JSON.parse(String(r.result)); } catch(e){}
    if (!raw || !Array.isArray(raw.cards)){ toast('このファイルは読めませんでした'); return; }
    var ns = (raw.shots || []).length;
    if (!confirm('名刺 ' + raw.cards.length + '枚' + (ns ? '（写真 ' + ns + '枚）' : '（写真なし）') +
      ' を読み込みます。いまの記録は置きかわります。よろしいですか？')) return;
    db.cards = raw.cards;
    db.cards.forEach(function(c){ if (!c.id) c.id = uid(); if (!c.ts) c.ts = Date.now(); });
    persist();
    thumbCache = {};
    busy(true, '写真をもどしています…');
    IDB.clear().then(function(){
      var chain = Promise.resolve();
      (raw.shots || []).forEach(function(s){
        if (!s || !s.id) return;
        chain = chain.then(function(){ return IDB.put({ id:s.id, full:s.full, thumb:s.thumb }); });
      });
      return chain;
    }).then(function(){
      busy(false); renderCards(); closeSheet(); toast('もどしました');
    }, function(){
      busy(false); renderCards(); closeSheet(); toast('文字はもどったが、写真はもどせなかった');
    });
  };
  r.onerror = function(){ toast('ファイルを読めませんでした'); };
  r.readAsText(file);
}

/* ===================== お試し用のサンプル ===================== */
function fakeShot(name, company, sub){
  var cv = document.createElement('canvas');
  cv.width = 728; cv.height = 440;
  var cx = cv.getContext('2d');
  var FF = '"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",IPAGothic,sans-serif';
  cx.fillStyle = '#fdfcf9'; cx.fillRect(0, 0, 728, 440);
  cx.fillStyle = '#4f7042'; cx.fillRect(0, 0, 728, 12);
  cx.fillStyle = '#e6e0d6'; cx.fillRect(48, 268, 300, 2);
  cx.fillStyle = '#3f4750'; cx.font = '600 27px ' + FF; cx.fillText(company, 48, 92);
  cx.fillStyle = '#9aa3ad'; cx.font = '500 19px ' + FF; cx.fillText(sub, 48, 128);
  cx.fillStyle = '#16191d'; cx.font = '700 52px ' + FF; cx.fillText(name, 48, 232);
  cx.fillStyle = '#6b7280'; cx.font = '500 18px ' + FF;
  cx.fillText('TEL 03-5555-0000 / FAX 03-5555-0001', 48, 320);
  cx.fillText('東京都千代田区丸の内1-1-1', 48, 352);
  cx.fillText('www.example.co.jp', 48, 384);
  var t = document.createElement('canvas');
  t.width = 320; t.height = 194;
  t.getContext('2d').drawImage(cv, 0, 0, 320, 194);
  return { full: cv.toDataURL('image/jpeg', 0.8), thumb: t.toDataURL('image/jpeg', 0.62) };
}
