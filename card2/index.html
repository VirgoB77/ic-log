<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b09">
<meta name="apple-mobile-web-app-title" content="名刺帖">
<title>名刺帖</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@700&family=Space+Grotesk:wght@600&display=swap">
<style>
:root{
  color-scheme:dark;
  --g:#0a0b09; --s:#131410; --s2:#1b1d17; --ink:#f2f3ec; --ink2:#b8bbad; --mute:#7d816f; --rule:#262920;
  --acc:#c9f24a; --accT:#d6f76b; --acc2:#e9ff8a; --accD:#a3cf25; --onAcc:#0f1206; --wash:#1f2a0d;
  --dim:rgba(0,0,0,.66); --glow:rgba(201,242,74,.5); --orb:rgba(201,242,74,.34);
  --moon1:#f2f3ea; --moon2:#a2a797; --moonSh:rgba(10,11,9,.26); --moonGlow:rgba(242,243,234,.38);
  /* 前の版の名前でも使えるようにしておく */
  --ground:var(--g); --card:var(--s); --sub:var(--ink2); --field:var(--s2); --key:var(--acc); --key-deep:var(--accD);
  --key-soft:var(--wash); --on-key:var(--onAcc); --ok:var(--accT);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.45);
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --num:"Space Grotesk","Zen Kaku Gothic New",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--g); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
.mincho{font-family:var(--serif)}
button{font:inherit;color:inherit}
svg{display:block;flex:none}

@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes orbitSpinR{to{transform:rotate(-360deg)}}
@keyframes fxRing{0%{transform:rotate(0deg) scale(.5);opacity:.95}100%{transform:rotate(230deg) scale(1.65);opacity:0}}
@keyframes fxCorona{0%{transform:scale(.5);opacity:.85}100%{transform:scale(2.1);opacity:0}}
@keyframes fxSun{0%{transform:scale(1)}35%{transform:scale(.9)}100%{transform:scale(1)}}

/* ===== 太陽・惑星・月 ===== */
.sun{appearance:none;border:0;padding:0;border-radius:50%;cursor:pointer;color:var(--onAcc);
  display:flex;align-items:center;justify-content:center;position:relative;flex:none;
  background:radial-gradient(circle at 38% 34%,var(--acc2) 0%,var(--acc) 58%,var(--accD) 100%)}
.sun.big{width:104px;height:104px;box-shadow:0 0 0 8px var(--wash),0 22px 50px -12px var(--glow),0 0 80px -8px var(--glow)}
.sun.md{width:62px;height:62px;box-shadow:0 0 0 5px var(--wash),0 14px 30px -10px var(--glow),0 0 40px -6px var(--glow)}
.sun.sm{width:60px;height:60px;box-shadow:0 0 0 5px var(--wash),0 14px 30px -10px var(--glow)}
.sun.xs{width:48px;height:48px;box-shadow:0 0 0 4px var(--wash),0 10px 24px -8px var(--glow)}
.sun:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.sun.hit{animation:fxSun .4s cubic-bezier(.2,.7,.2,1)}
.planet{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--s);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;text-decoration:none}
.planet.lg{width:48px;height:48px;background:var(--s2)}
.planet.acc{border-color:var(--acc);background:var(--s2);color:var(--accT)}
.planet.acc2{border:1.5px solid var(--acc);background:var(--s2);color:var(--accT)}
.planet.linebtn{background:#06C755;border-color:#06C755;color:#fff}
.planet:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.moon{appearance:none;margin-left:auto;position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);padding:0;overflow:hidden;cursor:pointer;flex:none;
  background:radial-gradient(circle at 36% 32%,var(--moon1) 0%,var(--moon2) 100%);
  box-shadow:inset -9px -6px 0 -1px var(--moonSh),0 0 22px -4px var(--moonGlow)}
.moon i{position:absolute;border-radius:50%;background:var(--moonSh)}
.moon:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.orbit{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid var(--orb)}
.pl{position:absolute;left:50%;top:50%;animation:orbitSpin linear infinite}
.pl.r{animation-name:orbitSpinR}
.pl i{position:absolute;left:50%;border-radius:50%}
.sunbox{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;flex:none}
.fxwrap{position:fixed;inset:0;pointer-events:none;z-index:300}
.fxb{position:absolute;width:0;height:0}
.fxc{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--acc2) 0%,var(--acc) 35%,rgba(0,0,0,0) 70%);animation:fxCorona .7s ease-out forwards}
.fxr{position:absolute;border-radius:50%;border:1px solid var(--acc);opacity:0;animation:fxRing .9s cubic-bezier(.2,.7,.2,1) forwards}
.fxr i{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
@media (prefers-reduced-motion:reduce){ .pl,.fxc,.fxr,.sun.hit{animation:none} .fxr{opacity:0} }

/* ===== 一覧の画面 ===== */
.wrap{max-width:620px;margin:0 auto;padding:0 20px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 0 0}
header .logo{display:flex;align-items:baseline;gap:10px;min-width:0}
header h1{font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:.14em;line-height:1;margin:0;white-space:nowrap}
header .n{font-family:var(--num);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.find{position:relative;margin-top:14px}
.find input[type=search]{width:100%;height:50px;font-family:inherit;font-size:16px;color:var(--ink);background:var(--s);
  border:1px solid var(--rule);border-radius:25px;padding:0 18px 0 46px;-webkit-appearance:none}
.find input[type=search]::placeholder{color:var(--mute)}
.find input[type=search]:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--wash)}
.find .mag{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;display:flex}
.solar{position:relative;height:272px;display:flex;align-items:center;justify-content:center}
.solar .pick{position:absolute;left:calc(50% + 60px);top:calc(50% + 35px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.listhead{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px}
.sortwrap{position:relative}
.sortbtn{appearance:none;border:0;background:none;padding:6px 0;font:inherit;font-size:13px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:4px}
.sortbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.sortmenu{position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:180px;background:var(--s2);border:1px solid var(--rule);border-radius:14px;
  padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sortmenu button{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:44px;padding:0 12px;border:0;background:none;
  font:inherit;font-size:15px;color:var(--ink);border-radius:10px;cursor:pointer;text-align:left}
.sortmenu button[aria-pressed="true"]{color:var(--accT);font-weight:700}
.sortmenu button:focus-visible{outline:2px solid var(--acc)}
/* 縦長の名刺は切らずに全体を入れる */
img.v{object-fit:contain !important}
.viewsw{display:flex;background:var(--s2);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;flex:none}
.viewsw button{appearance:none;border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;line-height:1;
  font-weight:500;padding:13px 16px;border-radius:999px;cursor:pointer}
.viewsw button[aria-pressed="true"]{background:var(--acc);color:var(--onAcc);font-weight:700}
.viewsw button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.lrow{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border:0;border-bottom:1px solid var(--rule);
  align-items:start;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;cursor:pointer}
.lrow:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:8px}
.lth{grid-row:1/4;position:relative;width:66px;height:40px;margin-top:3px;border-radius:5px;overflow:hidden;background:var(--s2);
  border:1px solid var(--rule);box-shadow:0 1px 3px rgba(0,0,0,.16);object-fit:cover;display:block}
.lth.no{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:700;color:var(--mute);letter-spacing:.05em}
.lnm{display:flex;align-items:center;gap:8px;min-width:0;font-size:18px;font-weight:700;line-height:1.25;letter-spacing:.02em}
.lnm>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnew{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);flex:none;display:inline-block}
.ld{font-family:var(--num);font-size:13px;font-weight:600;color:var(--mute);text-align:right;line-height:1.25;padding-top:4px;letter-spacing:.04em;white-space:nowrap}
.lco{font-size:14px;color:var(--ink2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.lpl{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap;line-height:1.3;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.lmemo{grid-column:2/-1;font-size:14px;color:var(--mute);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding-top:8px}
@media (min-width:520px){ .grid{grid-template-columns:1fr 1fr 1fr} }
.tile{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-width:0}
.tile:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:10px}
.tile .pic{aspect-ratio:91/55;border-radius:8px;overflow:hidden;background:var(--s2);border:1px solid var(--rule);
  box-shadow:0 1px 3px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.tile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pic .no{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--mute);letter-spacing:.05em}
.tile .nm{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;line-height:1.35;margin-top:8px;min-width:0}
.tile .nm>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .co{font-size:12.5px;color:var(--ink2);line-height:1.45;margin-top:1px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:26px 14px;line-height:2}

/* ===== 下から出る画面（新しい名刺・詳細・直す・設定） ===== */
.sheet{position:fixed;inset:0;z-index:50;background:var(--dim);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--s);width:100%;max-width:620px;height:calc(100% - 58px);height:calc(100dvh - 58px);
  border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.sheet .panel::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--rule);margin:8px auto 0;flex:none}
.pbody{flex:1;overflow:auto;padding:10px 18px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pfoot{padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);display:flex;align-items:center;
  justify-content:space-between;gap:8px;background:var(--s);flex:none}
.pfoot .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;color:var(--ink2);cursor:pointer}
.act small{font-size:11px;font-weight:600;white-space:nowrap}
.act.acc{color:var(--accT)}
.act:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.sheet h2{font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1.3;margin:0;padding-top:2px;word-break:break-word}
.thead{display:grid;grid-template-columns:1fr 120px;gap:0 14px;align-items:start}
.thead .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.thead .row2{display:flex;gap:8px}
.thumb{display:block;width:120px;height:73px;border-radius:6px;overflow:hidden;padding:0;border:0;background:var(--s2);cursor:zoom-in;
  box-shadow:0 1px 2px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.18)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.d{width:128px;height:77px}
.thumb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.fld{margin-top:16px;min-width:0}
.fld label,.pbody>label,.pbody .lab{display:block;font-size:12.5px;color:var(--mute);font-weight:500;letter-spacing:.04em;margin:0 0 6px}
.pbody>label{margin-top:22px}
.fld:focus-within label{color:var(--accT);font-weight:600}
.fld input,.fld textarea,.fld select,.pbody input[type=password],.pbody input[type=file]{
  width:100%;font-family:inherit;font-size:18px;color:var(--ink);background:var(--g);border:1px solid var(--rule);
  border-radius:14px;padding:0 16px;height:56px;-webkit-appearance:none}
.pbody input[type=file]{padding:14px 16px;font-size:14px;height:auto}
.fld textarea{height:auto;min-height:92px;padding:14px 16px;line-height:1.6;resize:vertical}
.fld input:focus,.fld textarea:focus,.pbody input[type=password]:focus{outline:none;border:1.5px solid var(--acc);box-shadow:0 0 0 4px var(--wash)}
.name-in{font-weight:600;font-size:19px !important;letter-spacing:.02em}
.strip{position:relative;width:100%;height:76px;border-radius:14px 14px 0 0;overflow:hidden;background:#f6f5f0;border:1.5px solid var(--acc);border-bottom:0;display:none}
.strip img{display:block;width:100%;height:100%}
.fld.has-strip .strip{display:block}
.fld.has-strip input{border-radius:0 0 14px 14px}
.half{display:flex;gap:10px}
.half>div{flex:1;min-width:0}
.later{margin-top:4px}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 1px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{appearance:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--rule);background:var(--s2);font:inherit;font-size:15px;
  display:flex;align-items:center;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none;max-width:100%}
.chip>span{overflow:hidden;text-overflow:ellipsis}
.chips.kind{margin:0 0 10px}
.chips.kind .chip{background:var(--s)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{height:3px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s ease}
.reading{font-size:13px;color:var(--mute);margin:8px 0 0;line-height:1.5}
.warn{font-size:13px;color:var(--accT);background:var(--wash);border:1px solid var(--acc);border-radius:14px;padding:11px 14px;margin-top:12px;line-height:1.7}
.spot{margin:12px 0 0;padding:12px 14px;border:1.5px solid var(--acc);border-radius:14px;background:var(--g)}
.spot .spot-t{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:2px;word-break:break-all}
details.more{margin-top:18px;border-top:1px solid var(--rule)}
details.more>summary{list-style:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--accT);padding:14px 0;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"＋";font-weight:700}
details.more[open]>summary::before{content:"−"}
details.more>summary .got{color:var(--mute);font-size:12px;font-weight:500}
.btn{appearance:none;border:1px solid var(--rule);background:var(--s2);color:var(--ink);font:inherit;font-size:15px;font-weight:600;
  border-radius:22px;height:44px;padding:0 16px;cursor:pointer;width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--onAcc);font-weight:700}
.btn.danger{color:var(--accT);border-color:var(--acc);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.7;margin:8px 0 0}
.hint b{color:var(--ink2)}
.opt{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:0}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--acc)}

/* ===== 名刺の詳細 ===== */
.dtop{display:flex;justify-content:flex-end;margin:-6px 0 2px}
.dhead{display:grid;grid-template-columns:1fr 128px;gap:0 14px;align-items:start}
.dname{font-size:28px;font-weight:700;letter-spacing:.01em;line-height:1.2;word-break:break-word}
.dorg{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5;word-break:break-word}
.suns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.suns a{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-decoration:none;color:var(--mute)}
.suns small{font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{margin-top:14px}
.f{display:grid;grid-template-columns:70px 1fr;gap:0 12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule)}
.f.withbtn{grid-template-columns:70px 1fr 44px;align-items:center;padding:8px 0}
.f .k{font-size:12.5px;color:var(--mute)}
.f .v{font-size:16px;line-height:1.5;word-break:break-word;white-space:pre-wrap;min-width:0}
.f .v a{color:var(--accT);font-weight:600;text-decoration:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;border-bottom:1px solid var(--rule)}
.f2 .f{border-bottom:0;grid-template-columns:70px 1fr;gap:0 8px}
.num{font-family:var(--num);font-weight:600}
.map{margin:10px 0 0}
.map iframe{width:100%;height:200px;border:1px solid var(--rule);border-radius:14px;display:block;background:var(--s2)}
.linepick{margin-top:14px;padding:12px 14px;border:1px solid var(--rule);border-radius:14px;background:var(--g)}
.pickhd{font-size:13px;font-weight:600;margin:0 0 4px}
.del{display:block;margin:28px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.credit{font-size:10.5px;color:var(--mute);text-align:center;letter-spacing:.03em;margin:30px 0 0;opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;background:var(--ink);color:var(--g);
  font-size:14px;font-weight:700;padding:12px 20px;border-radius:999px;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer.spot{cursor:crosshair}
.viewer.spot::after{content:"読み直したい文字を押してください";position:absolute;left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);
  padding:8px 16px;border-radius:999px;background:rgba(10,11,9,.7);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.92);font-size:13.5px;white-space:nowrap}

/* ===== カメラ ===== */
.cam{position:fixed;inset:0;z-index:60;background:#0a0b09;color:#fff}
.cam .stage{position:absolute;inset:0;overflow:hidden;background:#0a0b09}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
/* 名刺の形の枠は見せない（見つからなかったときに切る範囲の目安として、位置だけ持っておく） */
.cam .box{position:absolute;left:10%;width:80%;aspect-ratio:91/55;top:50%;transform:translateY(-50%);visibility:hidden;pointer-events:none}
/* 中央の丸。名刺を見つけると光って、ピコン、ピコンと輪が広がる */
.cam .ping{position:absolute;left:50%;top:50%;width:min(62vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid rgba(255,255,255,.3);pointer-events:none;
  transition:left .2s ease-out,top .2s ease-out,width .2s ease-out,border-color .25s,box-shadow .25s}
.cam .ping i{position:absolute;inset:-2px;border-radius:50%;border:2px solid #c9f24a;opacity:0}
.cam.found .ping{border-color:#c9f24a;box-shadow:0 0 28px rgba(201,242,74,.35),inset 0 0 28px rgba(201,242,74,.12)}
.cam.found .ping i{animation:ping 2.4s ease-out infinite}
.cam.found .ping i+i{animation-delay:1.2s}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){ .cam.found .ping i{animation:none} }
.confirm-pic{margin-top:14px;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3)}
.confirm-pic img{display:block;width:100%}
.cam .top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.glass{appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(10,11,9,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none}
.glass.lg{width:48px;height:48px;justify-self:start}
.glass.on{background:rgba(201,242,74,.9);color:#0f1206}
.cam .tipwrap{position:absolute;left:18px;right:18px;bottom:calc(196px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:2}
.cam .tip{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:999px;background:rgba(10,11,9,.66);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.92);font-size:13.5px;line-height:1.4;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin:0;text-align:left}
.cam .tip::before{content:"";width:8px;height:8px;border-radius:50%;background:#c9f24a;box-shadow:0 0 10px #c9f24a;flex:none}
.cam .ctl{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));height:112px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;z-index:2}
.shotbox{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center}
.pluto{appearance:none;position:relative;width:74px;height:74px;border-radius:50%;border:0;padding:0;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 40% 36%,#f4e9d6 0%,#ddc3a1 44%,#a3714b 100%);
  box-shadow:0 0 0 5px rgba(201,242,74,.18),0 0 50px -6px rgba(201,242,74,.5)}
.pluto svg{position:absolute;left:0;top:0}
.pluto:active{transform:scale(.94)}
.shotbox .orbit{display:none}
.shotbox.found .orbit{display:block}
.shotbox .st{display:none;position:absolute;inset:2px;border-radius:50%;pointer-events:none}
.shotbox .st.hurry{border:2px solid rgba(255,255,255,.55)}
.shotbox.hurry .st.hurry{display:block}
.cam .err{color:#fff;font-size:13.5px;line-height:1.9;padding:26px 22px;text-align:center}

/* ===== 切り直し（四隅を動かす） ===== */
.cropbox{position:relative;margin-top:14px;border-radius:14px;overflow:hidden;background:#0c0b0a;touch-action:none}
.cropbox img{width:100%;display:block}
.cropbox svg{position:absolute;inset:0;width:100%;height:100%}

.busy{position:fixed;inset:0;z-index:90;background:var(--dim);display:flex;align-items:center;justify-content:center}
.busy span{background:var(--s2);color:var(--ink);font-size:14px;font-weight:600;padding:15px 24px;border-radius:999px;box-shadow:var(--shadow);border:1px solid var(--rule)}
</style>
</head>

<script>
(function(){
'use strict';

/* ===================== 文字を読む部品の置き場所 =====================
   ふだんは CDN から取ってくる。自分で置きたいときは ?ocr=（置いた場所）を付けて開く。
   置き場所には tesseract.min.js / worker.min.js / core/ / lang/ を入れておく。      */
var OCRBASE = (function(){
  var m = location.search.match(/[?&]ocr=([^&]+)/);
  return m ? decodeURIComponent(m[1]).replace(/\/$/, '') : '';
})();
var OCR = OCRBASE ? {
  lib:    OCRBASE + '/tesseract.min.js',
  worker: OCRBASE + '/worker.min.js',
  core:   OCRBASE + '/core',
  lang:   OCRBASE + '/lang'
} : {
  lib:    'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core:   'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  lang:   'https://cdn.jsdelivr.net/npm/@tesseract.js-data/jpn@1.0.0/4.0.0_best_int'
};

/* ===================== 保存（端末内のみ） ===================== */
var KEY = 'meishi.v1';
var db = { cards:[], mail:'' };
(function load(){
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if (raw && typeof raw === 'object'){
    db.cards = Array.isArray(raw.cards) ? raw.cards : [];
    db.mail  = typeof raw.mail === 'string' ? raw.mail : '';
  }
  for (var i = 0; i < db.cards.length; i++){
    var c = db.cards[i];
    if (!c.id) c.id = uid();
    if (!c.ts) c.ts = Date.now();
  }
})();
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('保存できませんでした。端末の空き容量を確認してください'); }
}

/* 名刺の写真は大きいので IndexedDB に置く */
var IDB = (function(){
  var dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise(function(res, rej){
      if (!window.indexedDB){ rej(new Error('indexedDB なし')); return; }
      var rq = indexedDB.open('meishi', 1);
      rq.onupgradeneeded = function(){
        var d = rq.result;
        if (!d.objectStoreNames.contains('shots')) d.createObjectStore('shots', { keyPath:'id' });
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror   = function(){ rej(rq.error); };
    });
    return dbp;
  }
  function work(mode, fn){
    return open().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction('shots', mode), rq = fn(t.objectStore('shots'));
        t.oncomplete = function(){ res(rq ? rq.result : null); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    get:   function(id){ return work('readonly',  function(s){ return s.get(id); }); },
    put:   function(o){  return work('readwrite', function(s){ return s.put(o); }); },
    del:   function(id){ return work('readwrite', function(s){ return s.delete(id); }); },
    all:   function(){   return work('readonly',  function(s){ return s.getAll ? s.getAll() : null; }); },
    clear: function(){   return work('readwrite', function(s){ return s.clear(); }); }
  };
})();
if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }

/* ===================== 小道具 ===================== */
var $ = function(id){ return document.getElementById(id); };
var WD = ['日','月','火','水','木','金','土'];
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function two(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function trim(s){ return String(s == null ? '' : s).trim(); }
function ymd(d){ return d.getFullYear() + '-' + two(d.getMonth()+1) + '-' + two(d.getDate()); }
function today(){ return ymd(new Date()); }
function toDate(s){
  if (!s) return null;
  var p = String(s).split('-');
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(s){ var d = toDate(s); return d ? (d.getMonth()+1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）' : ''; }

var toastTimer = null;
function toast(msg){
  var el = document.querySelector('.toast');
  if (!el){ el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2800);
}
function busy(on, msg){
  var el = document.querySelector('.busy');
  if (on){
    if (!el){ el = document.createElement('div'); el.className='busy'; el.innerHTML='<span></span>'; document.body.appendChild(el); }
    el.firstChild.textContent = msg || 'しばらくお待ちください…';
  } else if (el && el.parentNode) el.parentNode.removeChild(el);
}

/* 探すときは、大文字小文字・全角半角・カタカナひらがな・「株式会社」を区別しない */
function norm(s){
  s = String(s == null ? '' : s).toLowerCase();
  s = s.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); });
  s = s.replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
  s = s.replace(/株式会社|有限会社|合同会社|一般社団法人|\(株\)|（株）|\(有\)|（有）/g, '');
  return s.replace(/[\s　・ー\-‐-―()（）.,、。]/g, '');
}

/* ===================== 名刺 ===================== */
var F = ['name','kana','company','dept','title','tel','mobile','email','url','addr','kind','met','where','memo'];
/* 名刺に書いてある住所そのままで地図を出す（支店の名刺なら支店の住所のまま） */
function mapQuery(c){ return trim(c.addr); }
function mapsAppUrl(c){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(mapQuery(c));
}
function mapEmbedUrl(c){
  if (!mapKey) return '';
  return 'https://www.google.com/maps/embed/v1/place?key=' + encodeURIComponent(mapKey) +
         '&q=' + encodeURIComponent(mapQuery(c)) + '&language=ja&region=JP&zoom=16';
}
function fullName(c){ return trim(c.name) || (trim(c.company) ? trim(c.company) : '名前がまだ'); }
function orgLine(c){ return [trim(c.company), trim(c.dept), trim(c.title)].filter(Boolean).join(' '); }
function matches(c, q){
  if (!q) return true;
  var hay = norm(F.map(function(k){ return c[k]; }).join(' '));
  var t = q.split(/[\s　]+/).filter(Boolean);
  for (var i = 0; i < t.length; i++) if (hay.indexOf(norm(t[i])) < 0) return false;
  return true;
}

/* ===================== 写真 ===================== */
var thumbCache = {};
function readImage(file, cb){
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload  = function(){ cb(im); setTimeout(function(){ URL.revokeObjectURL(url); }, 3000); };
  im.onerror = function(){ URL.revokeObjectURL(url); cb(null); };
  im.src = url;
}
/* 文字を読ませるための下ごしらえ：長辺2000pxまで拡大し、白黒にして濃淡を強める */
function forOcr(src, target){
  var w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  var s = Math.min(3, (target || 2000) / Math.max(w, h));
  var cw = Math.max(1, Math.round(w*s)), ch = Math.max(1, Math.round(h*s));
  var cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  var cx = cv.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(src, 0, 0, cw, ch);
  try {
    var d = cx.getImageData(0, 0, cw, ch), p = d.data, hist = new Int32Array(256);
    for (var i0 = 0; i0 < p.length; i0 += 4) hist[(0.299*p[i0] + 0.587*p[i0+1] + 0.114*p[i0+2])|0]++;
    /* 地の色が暗い名刺（紺や緑に白文字）は、白黒を反転させてから読む */
    var acc = 0, medg = 0, half = (p.length / 4) >> 1;
    for (var t0 = 0; t0 < 256; t0++){ acc += hist[t0]; if (acc >= half){ medg = t0; break; } }
    var inv = medg < 110;
    for (var i = 0; i < p.length; i += 4){
      var g = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
      if (inv) g = 255 - g;
      g = g < 128 ? Math.max(0, (g-40)*1.6) : Math.min(255, (g-128)*1.6 + 150);
      p[i] = p[i+1] = p[i+2] = g;
    }
    cx.putImageData(d, 0, 0);
  } catch(e){}
  return cv;
}
function toCanvas(src, maxEdge){
  var w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  var sc = Math.min(1, maxEdge / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * sc));
  c.height = Math.max(1, Math.round(h * sc));
  var x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function rotCanvas(src){ return rotCanvasK(src, 1); }
/* k×90度、時計回りに回す */
function rotCanvasK(src, k){
  k = ((k % 4) + 4) % 4;
  if (!k) return src;
  var c = document.createElement('canvas');
  if (k === 2){ c.width = src.width; c.height = src.height; }
  else { c.width = src.height; c.height = src.width; }
  var x = c.getContext('2d');
  x.translate(c.width/2, c.height/2);
  x.rotate(k * Math.PI/2);
  x.drawImage(src, -src.width/2, -src.height/2);
  return c;
}

/* ===== 名刺の四隅をさがす =====
   写真ぜんぶを読ませると、机まで含めて文字が小さくなり読みちがえる。
   明るい紙のかたまりを中心から塗り広げて見つけ、その四隅を返す。 */
function findQuad(src, w){
  if (OCRBASE) window.__findQuad = findQuad;
  w = w || 360;
  var h = Math.max(1, Math.round(src.height * w / src.width));
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(src, 0, 0, w, h);
  var d;
  try { d = c.getContext('2d').getImageData(0, 0, w, h).data; } catch(e){ return null; }
  var N = w*h, L = new Float32Array(N), A = new Float32Array(N), B = new Float32Array(N);
  var hist = [];
  for (var i0 = 0; i0 < 256; i0++) hist[i0] = 0;
  for (var i = 0, j = 0; i < d.length; i += 4, j++){
    var r = d[i], g = d[i+1], b = d[i+2];
    L[j] = 0.299*r + 0.587*g + 0.114*b; A[j] = r - g; B[j] = (r+g)/2 - b;
    hist[L[j]|0]++;
  }
  /* 机の色：写真の縁の画素の中央値 */
  var eL = [], eA = [], eB = [];
  function edge(k){ eL.push(L[k]); eA.push(A[k]); eB.push(B[k]); }
  for (var x = 0; x < w; x += 2){ for (var y = 0; y < 4; y++){ edge(y*w + x); edge((h-1-y)*w + x); } }
  for (var y2 = 0; y2 < h; y2 += 2){ for (var x2 = 0; x2 < 4; x2++){ edge(y2*w + x2); edge(y2*w + (w-1-x2)); } }
  function med(a){ a.sort(function(p, q){ return p - q; }); return a[a.length >> 1]; }
  var mL = med(eL), mA = med(eA), mB = med(eB);
  if (window.__fqLog) window.__fqLog.push({ mL:mL, mA:mA, mB:mB, w:w, h:h });
  /* 明るさのしきい値（大津） */
  var tot = N, sum = 0;
  for (var t = 0; t < 256; t++) sum += t*hist[t];

function openRecrop(){
  if (!pendRaw) return;
  var keep = $('s-name') ? grabForm() : null;
  var W = pendRaw.width, H = pendRaw.height;
  var url = toCanvas(pendRaw, 1100).toDataURL('image/jpeg', 0.82);
  var q = pendQuad.map(function(pp){ return [pp[0], pp[1]]; });
  var rr = Math.max(9, W/55), sw = Math.max(2, W/280);
  var h = '<div class="pbody"><h2>四隅を合わせる</h2>' +
    '<p class="reading">丸をつまんで、名刺の角に合わせてください。</p>' +
    '<div class="cropbox" id="cb"><img src="' + url + '" alt="撮った写真">' +
    '<svg id="cb-svg" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<polygon id="cb-poly" fill="rgba(201,242,74,.16)" stroke="#c9f24a" stroke-width="' + sw + '"></polygon>' +
    '<g id="cb-dots"></g></svg></div></div>' +
    '<div class="pfoot"><button class="planet lg" id="cb-cancel" aria-label="やめる">' + IC.x + '</button>' +
    '<button class="btn" id="cb-all" style="width:auto;margin:0">全体を使う</button>' +
    '<div class="sunbox"><div class="orbit">' + orbitHtml('save') + '</div>' +
    '<button class="sun md" id="cb-ok" aria-label="読み直す">' + IC.check + '</button></div></div>';
  openSheet(h, function(){
    var svg = $('cb-svg'), poly = $('cb-poly'), dots = $('cb-dots'), active = -1;
    function draw(){
      poly.setAttribute('points', q.map(function(pp){ return pp[0] + ',' + pp[1]; }).join(' '));
      var g = '';
      for (var i = 0; i < 4; i++)
        g += '<circle cx="' + q[i][0] + '" cy="' + q[i][1] + '" r="' + rr +
             '" fill="#f2f3ec" stroke="#0a0b09" stroke-width="' + sw + '"></circle>';
      dots.innerHTML = g;
    }
    function at(ev){
      var r = svg.getBoundingClientRect();
      return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H];
    }
    function put(pnt){
      q[active] = [Math.max(0, Math.min(W, pnt[0])), Math.max(0, Math.min(H, pnt[1]))];
      draw();
    }
    svg.addEventListener('pointerdown', function(ev){
      var pnt = at(ev), bi = 0, bd = 1e18;
      for (var i = 0; i < 4; i++){
        var d = (q[i][0]-pnt[0])*(q[i][0]-pnt[0]) + (q[i][1]-pnt[1])*(q[i][1]-pnt[1]);
        if (d < bd){ bd = d; bi = i; }
      }
      active = bi; put(pnt); ev.preventDefault();
    });
    svg.addEventListener('pointermove', function(ev){
      if (active < 0) return;
      put(at(ev)); ev.preventDefault();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(t){
      svg.addEventListener(t, function(){ active = -1; });
    });
    draw();
    function apply(qd){
      pendQuad = qd; pendCropped = true;
      busy(true, '切り出しています…');
      setTimeout(function(){
        buildPend(); busy(false);
        if (keep){ openSave(keep); runOcr(pendCard); } else openConfirm();
      }, 30);
    }
    $('cb-ok').addEventListener('click', function(){ apply(q); });
    $('cb-all').addEventListener('click', function(){ apply(fullQuad(pendRaw)); });
    $('cb-cancel').addEventListener('click', function(){
      if (keep) openSave(keep); else openConfirm();
    });
  });
}

/* ===== アプリの中のカメラ（シャッター音は鳴らない） ===== */
var camStream = null, camTrack = null, torchOn = false;
/* ===== 生きた映像から四隅をさがす =====
   200msごとに小さな絵で名刺の四隅をさがし、見つかったら中央の丸を光らせる。
   撮るのは人が丸いボタンを押したときだけ。撮ったあとに切り取りを確認してから読み取る */
var liveTimer = null, liveQuad = null, liveHist = [], liveArmed = false, liveShotAt = 0, liveMiss = 0;
/* 映像は画面いっぱいに切って出している（object-fit:cover）ので、
   映像の全部ではなく、いま画面に見えているところだけをさがす。
   見えていない外側の机や、となりの物にまどわされない */
function camVisibleSrc(){
  var v = $('cam-video');
  if (!v || !v.videoWidth) return null;
  var vr = v.getBoundingClientRect();
  if (!vr.width || !vr.height) return null;
  var sc = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
  var w = Math.min(v.videoWidth, vr.width / sc), h = Math.min(v.videoHeight, vr.height / sc);
  return { x:(v.videoWidth - w) / 2, y:(v.videoHeight - h) / 2, w:w, h:h };
}
function camFrameRect(){
  var v = $('cam-video'), vr = v.getBoundingClientRect(), st = $('cam-stage').getBoundingClientRect();
  var sc = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
  return { sc:sc, ox:vr.left - st.left + (vr.width - v.videoWidth*sc) / 2, oy:vr.top - st.top + (vr.height - v.videoHeight*sc) / 2, w:st.width, h:st.height };
}
/* 名刺を見つけたら、丸を名刺の上に動かして光らせる（四角の枠は描かない）。
   見つけているあいだは名刺を追い、見失ったら中央に戻る */
function drawLive(q, good){
  var cam = $('cam'), ping = $('cam-ping'), v = $('cam-video');
  if (!cam || !ping) return;
  cam.classList.toggle('found', !!good);
  if (q && v && v.videoWidth){
    var fr = camFrameRect(), pts = q.map(function(p){
      return [fr.ox + p[0]*v.videoWidth*fr.sc, fr.oy + p[1]*v.videoHeight*fr.sc];
    });
    var cx = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4, cy = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4;
    var w = Math.hypot(pts[1][0]-pts[0][0], pts[1][1]-pts[0][1]), h = Math.hypot(pts[3][0]-pts[0][0], pts[3][1]-pts[0][1]);
    var d = Math.max(120, Math.min(340, Math.min(w, h) * 0.95));
    ping.style.left = cx.toFixed(1) + 'px'; ping.style.top = cy.toFixed(1) + 'px'; ping.style.width = d.toFixed(0) + 'px';
  } else {
    ping.style.left = ''; ping.style.top = ''; ping.style.width = '';
  }
}
if (OCRBASE) window.__drawLive = drawLive;
function liveStep(){
  liveTimer = null;
  var v = $('cam-video');
  if ($('cam').hidden) return;
  /* まだカメラが立ち上がっていない（初回は許可を待つぶん遅い）。止めずに待つ */
  if (!camStream){ liveTimer = setTimeout(liveStep, 200); return; }
  if (v.videoWidth && v.readyState >= 2){
    var src = camVisibleSrc();
    if (!src){ liveTimer = setTimeout(liveStep, 200); return; }
    var W = 260, H = Math.max(1, Math.round(src.h * W / src.w));
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var qd = null;
    try {
      c.getContext('2d').drawImage(v, src.x, src.y, src.w, src.h, 0, 0, W, H);
      qd = findQuad(c, W);
    } catch(e){ qd = null; }
    /* 見えている範囲の割合を、映像ぜんぶに対する割合に直す */
    var q = qd ? qd.map(function(p){
      var fx = Math.min(1, Math.max(0, p[0] / W)), fy = Math.min(1, Math.max(0, p[1] / H));
      return [(src.x + fx * src.w) / v.videoWidth, (src.y + fy * src.h) / v.videoHeight];
    }) : null;
    /* 見えている範囲の縁にかかっていないか（かかっていたら名刺が画面からはみ出している） */
    var edge = false, area = 0;
    if (qd){
      qd.forEach(function(p){ if (p[0] < W*0.012 || p[0] > W*0.988 || p[1] < H*0.012 || p[1] > H*0.988) edge = true; });
      for (var ai = 0; ai < 4; ai++){
        var p1 = qd[ai], p2 = qd[(ai+1) % 4];
        area += p1[0]*p2[1] - p2[0]*p1[1];
      }
      area = Math.abs(area) / 2 / (W * H);
    }
    var big = area >= 0.12;                       /* 小さすぎる（遠すぎる）と、見つけた扱いにしない */
    liveQuad = q;
    liveMiss = q ? 0 : liveMiss + 1;
    var good = !!q && !edge && big;
    drawLive(q, good);
    var tip = $('cam-tip'), sb = $('cam-shotbox');
    /* シャッター（冥王星）のまわり：見つけたら衛星が回る、見つからないままなら白い輪。撮るのは人が押したときだけ */
    if (sb) sb.className = 'shotbox' + (good ? ' found' : '') + (!q && liveMiss > 12 ? ' hurry' : '');
    if (tip){
      tip.textContent = !q ? (liveMiss > 12 ? '見つからないままでも、丸いボタンで撮れます'
                                            : '名刺を画面に入れてください。机との境がはっきり写るようにします')
                      : edge ? '名刺全体が入るように、少し離してください'
                      : !big ? '名刺が小さいです。もう少し近づけてください'
                      : '見つけました。丸いボタンで撮ってください';
    }
  }
  liveTimer = setTimeout(liveStep, 200);
}
function openCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('file-cam').click(); return; }
  $('cam').hidden = false;
  document.body.style.overflow = 'hidden';
  liveQuad = null; liveHist = []; liveArmed = true; liveShotAt = Date.now(); liveMiss = 0;
  drawLive(null);
  if ($('cam-shotbox')) $('cam-shotbox').className = 'shotbox';
  $('cam').classList.remove('found');
  if ($('cam-tip')) $('cam-tip').textContent = '名刺を画面に入れてください。机との境がはっきり写るようにします';
  if (liveTimer) clearTimeout(liveTimer);
  liveTimer = setTimeout(liveStep, 400);
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 } },
    audio: false
  }).then(function(st){
    camStream = st;
    camTrack = st.getVideoTracks()[0];
    var v = $('cam-video');
    v.srcObject = st;
    var pl = v.play();
    if (pl && pl['catch']) pl['catch'](function(){});
    if (!liveTimer && !$('cam').hidden) liveTimer = setTimeout(liveStep, 100);
    try {
      if (camTrack.applyConstraints)
        camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] })['catch'](function(){});
      var cap = camTrack.getCapabilities ? camTrack.getCapabilities() : null;
      $('cam-torch').hidden = !(cap && cap.torch);
    } catch(e){}
  }, function(){
    closeCamera();
    toast('カメラを使えませんでした。写真から選んでください');
    $('file-pick').click();
  });
}
function closeCamera(){
  $('cam').hidden = true;
  document.body.style.overflow = '';
  if (liveTimer){ clearTimeout(liveTimer); liveTimer = null; }
  liveArmed = false;
  if (camStream){
    camStream.getTracks().forEach(function(t){ try { t.stop(); } catch(e){} });
    camStream = null; camTrack = null;
  }
  try { $('cam-video').srcObject = null; } catch(e){}
  torchOn = false;
}
/* 画面に出している枠が、写真のどこにあたるかを割合で返す（object-fit:cover の分を戻す） */
function guideFrac(){
  var v = $('cam-video'), bx = $('cam-box');
  if (!v || !bx || !v.videoWidth) return null;
  var vr = v.getBoundingClientRect(), br = bx.getBoundingClientRect();
  if (!vr.width || !vr.height || !br.width) return null;
  var sc = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
  var ox = vr.left + (vr.width - v.videoWidth*sc) / 2;
  var oy = vr.top + (vr.height - v.videoHeight*sc) / 2;
  var x = (br.left - ox)/sc, y = (br.top - oy)/sc, w = br.width/sc, h = br.height/sc;
  x -= w*0.04; y -= h*0.06; w *= 1.08; h *= 1.12;      /* 少し広めに取る */
  x = Math.max(0, x); y = Math.max(0, y);
  w = Math.min(v.videoWidth - x, w); h = Math.min(v.videoHeight - y, h);
  if (w < 40 || h < 40) return null;
  return { x:x/v.videoWidth, y:y/v.videoHeight, w:w/v.videoWidth, h:h/v.videoHeight };
}
function camCapture(){
  var v = $('cam-video');
  if (!v.videoWidth){ toast('もう少し待ってから押してください'); return; }
  var hint = guideFrac();
  if (liveQuad) hint = { quad: liveQuad };       /* 映像で見つけていた四隅を、見つけ直せなかったときの控えにする */
  var c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  if (OCRBASE) window.__camSize = [v.videoWidth, v.videoHeight];
  closeCamera();
  pendFromCam = true;
  processRaw(toCanvas(c, 3000), hint);
}

/* ===================== 連絡先ファイル（vCard） ===================== */
function ve(s){
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
    .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
}
function foldB64(prefix, b64){
  var out = prefix + b64.slice(0, Math.max(0, 72 - prefix.length));
  var rest = b64.slice(Math.max(0, 72 - prefix.length));
  while (rest.length){ out += '\r\n ' + rest.slice(0, 71); rest = rest.slice(71); }
  return out;
}
function vcard(c, photo){
  var L = ['BEGIN:VCARD', 'VERSION:3.0'];
  var nm = trim(c.name) || trim(c.company) || '名刺';
  var p = nm.split(/[\s　]+/);
  L.push('N:' + ve(p[0] || nm) + ';' + ve(p.slice(1).join(' ')) + ';;;');
  L.push('FN:' + ve(nm));
  if (trim(c.kana)){
    var k = trim(c.kana).split(/[\s　]+/);
    L.push('X-PHONETIC-LAST-NAME:' + ve(k[0] || ''));
    if (k.length > 1) L.push('X-PHONETIC-FIRST-NAME:' + ve(k.slice(1).join(' ')));
  }
  if (trim(c.company) || trim(c.dept)) L.push('ORG:' + ve(c.company) + ';' + ve(c.dept));
  if (trim(c.title))  L.push('TITLE:' + ve(c.title));
  if (trim(c.tel))    L.push('TEL;TYPE=WORK,VOICE:' + ve(c.tel));
  if (trim(c.mobile)) L.push('TEL;TYPE=CELL,VOICE:' + ve(c.mobile));
  if (trim(c.email))  L.push('EMAIL;TYPE=INTERNET,WORK:' + ve(c.email));
  if (trim(c.url))    L.push('URL:' + ve(siteUrl(c.url)));
  if (trim(c.addr))   L.push('ADR;TYPE=WORK:;;' + ve(c.addr) + ';;;;');
  var note = [];
  if (c.met) note.push('会った日 ' + c.met + (trim(c.where) ? '（' + trim(c.where) + '）' : ''));
  else if (trim(c.where)) note.push('どこで ' + trim(c.where));
  if (trim(c.memo)) note.push(trim(c.memo));
  if (note.length) L.push('NOTE:' + ve(note.join('\n')));
  var body = L.join('\r\n');
  if (photo){
    var i = photo.indexOf(',');
    if (i > 0) body += '\r\n' + foldB64('PHOTO;ENCODING=b;TYPE=JPEG:', photo.slice(i + 1));
  }
  return body + '\r\nEND:VCARD\r\n';
}
function safeName(s){ return String(s || '名刺').replace(/[\\\/:*?"<>|]/g, '_').slice(0, 40); }
function saveVcf(c){
  if (!c.shot){ saveFile(safeName(fullName(c)) + '.vcf', vcard(c, null), 'text/vcard;charset=utf-8'); return; }

    if (!file || !navigator.canShare || !navigator.canShare({ files:[file] })){
      toast('この端末では写真を送れません。写真を長押しして保存してください');
      showBig(sh.full);

function dataUrlToFile(url, name){
  try {
    var parts = String(url).split(',');
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
    var bin = atob(parts[1]), n = bin.length, u8 = new Uint8Array(n);
    while (n--) u8[n] = bin.charCodeAt(n);
    return new File([u8], name, { type:mime });
  } catch(e){ return null; }
}

var savePromise = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads')['catch'](function(){ return null; }) : null;
function copyText(text, okMsg){
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    toast(ok ? okMsg : 'コピーできませんでした');
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  else fallback();
}
function saveFile(name, data, mime){
  if (savePromise){
    toast('保存を準備しています…');
    savePromise.then(function(dl){
      if (!dl || !dl.save){ toast('この画面ではファイル保存を使えません'); return; }
      dl.save({ filename:name, data:data }).then(function(){ toast('保存しました'); }, function(err){
        if (err && err.code === 'declined') return;
        toast('保存できませんでした');
      });
    });
    return;
  }
  try {
    var url = URL.createObjectURL(new Blob([data], { type:mime }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    toast('保存しました');
  } catch(e){ toast('保存できませんでした'); }
}

function doBackup(withPhotos){
  var base = { app:'meishibako', v:2, at:new Date().toISOString(), cards:db.cards };
  if (!withPhotos){
    saveFile('名刺帖_バックアップ_文字だけ_' + today() + '.json', JSON.stringify(base), 'application/json');
    return;
  }
  busy(true, '写真をまとめています…');
  IDB.all().then(function(rows){
    busy(false);
    base.shots = (rows || []).filter(function(r){ return r && r.id && r.id.indexOf('__') !== 0; });
    saveFile('名刺帖_バックアップ_' + today() + '.json', JSON.stringify(base), 'application/json');
  }, function(){ busy(false); toast('写真を読み出せませんでした'); });
}
function doRestore(file){
  var r = new FileReader();
  r.onload = function(){
    var raw = null;
    try { raw = JSON.parse(String(r.result)); } catch(e){}
    if (!raw || !Array.isArray(raw.cards)){ toast('このファイルは読めませんでした'); return; }
    var ns = (raw.shots || []).length;
    if (!confirm('名刺 ' + raw.cards.length + '枚' + (ns ? '（写真 ' + ns + '枚）' : '（写真なし）') +
      ' を読み込みます。いまの記録は置きかわります。よろしいですか？')) return;
    db.cards = raw.cards;
    db.cards.forEach(function(c){ if (!c.id) c.id = uid(); if (!c.ts) c.ts = Date.now(); });
    persist();
    thumbCache = {};
    busy(true, '写真をもどしています…');
    IDB.clear().then(function(){
      var chain = Promise.resolve();
      (raw.shots || []).forEach(function(s){
        if (!s || !s.id) return;
        chain = chain.then(function(){ return IDB.put({ id:s.id, full:s.full, thumb:s.thumb }); });
      });
      return chain;
    }).then(function(){
      busy(false); renderCards(); closeSheet(); toast('復元しました');
    }, function(){
      busy(false); renderCards(); closeSheet(); toast('文字は復元しましたが、写真は復元できませんでした');
    });
  };
  r.onerror = function(){ toast('ファイルを読めませんでした'); };
  r.readAsText(file);
}

      addr:'東京都港区新橋2-2-2', where:'東京ビッグサイトの展示会', d:3,
      memo:'名刺の裏に地図。テナントの話ならこの人。' },
    { name:'佐藤 健一', kana:'さとう けんいち', company:'株式会社ヤマダ商事', dept:'総務部',
      tel:'03-5555-0002', email:'sato@example.co.jp', where:'東京ビッグサイトの展示会', d:3,
      memo:'山田さんの部下。請求の窓口はこちら。' },
    { name:'田中 みどり', kana:'たなか みどり', company:'みどり印刷有限会社', title:'代表取締役',
      mobile:'080-5555-6666', email:'midori@midori-print.jp',
      addr:'〒460-0008 愛知県名古屋市中区栄3-2-1', where:'商工会の新年会', d:40,
      memo:'チラシと封筒はここに頼んでいる。小ロットも受けてくれる。' },
    { name:'高橋 学', kana:'たかはし まなぶ', company:'高橋建設株式会社', dept:'工務部', title:'部長',

      memo:'倉庫の改修の見積をもらったことがある。話が早い。' }
  ];
  var chain = Promise.resolve();
  S.forEach(function(s, i){
    var d = back(s.d); d.setHours(14, 20, 0, 0);
    var c = { id:uid() + i, ts:d.getTime(), shot:1, met:ymd(d) };
    F.forEach(function(k){ if (k !== 'met') c[k] = s[k] || ''; });
    db.cards.push(c);
    var sh = fakeShot(c.name, c.company, [c.dept, c.title].filter(Boolean).join(' '));
    chain = chain.then(function(){ return putShot(c.id, sh); });
  });
  db.cards.sort(function(a, b){ return b.ts - a.ts; });
  persist();
  chain.then(function(){ renderCards(); closeSheet(); toast('サンプルを入れました'); });
}

/* ===================== 配線 ===================== */
$('btn-shoot').addEventListener('click', openCamera);
$('cam-close').addEventListener('click', closeCamera);
$('cam-shot').addEventListener('click', camCapture);
$('cam-pick').addEventListener('click', function(){ closeCamera(); $('file-pick').click(); });
$('cam-torch').addEventListener('click', function(){
  if (!camTrack || !camTrack.applyConstraints) return;
  torchOn = !torchOn;
  camTrack.applyConstraints({ advanced: [{ torch: torchOn }] })['catch'](function(){ torchOn = false; });
  $('cam-torch').classList.toggle('on', torchOn);
});
$('btn-pick').addEventListener('click',  function(){ $('file-pick').click(); });
$('file-cam').addEventListener('change',  function(){ startCapture(this.files[0]); this.value = ''; });
$('file-pick').addEventListener('change', function(){ startCapture(this.files[0]); this.value = ''; });
$('btn-gear').addEventListener('click', openSettings);
var qT = null;
$('q').addEventListener('input', function(){ clearTimeout(qT); qT = setTimeout(renderCards, 120); });
document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('.tile[data-id],.lrow[data-id]') : null;
  if (b) openCard(b.getAttribute('data-id'));
});
function toggleSortMenu(open){
  var m = $('sortmenu'), b = $('sortbtn');
  if (open){
    m.innerHTML = SORTS.map(function(o){
      return '<button data-s="' + o[0] + '" aria-pressed="' + (o[0] === sortKey ? 'true' : 'false') + '">' + o[1] +
        (o[0] === sortKey ? IC.check.replace('width="28" height="28"', 'width="18" height="18"') : '') + '</button>';
    }).join('');
  }
  m.hidden = !open; b.setAttribute('aria-expanded', open ? 'true' : 'false');
}
$('sortbtn').addEventListener('click', function(){ toggleSortMenu($('sortmenu').hidden); });
$('sortmenu').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button[data-s]') : null;
  if (!b) return;
  sortKey = b.getAttribute('data-s');
  try { localStorage.setItem(SKEY, sortKey); } catch(e){}
  toggleSortMenu(false); renderCards();
});
document.addEventListener('click', function(ev){
  if ($('sortmenu').hidden) return;
  if (ev.target.closest && ev.target.closest('.sortwrap')) return;
  toggleSortMenu(false);
});
$('viewsw').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button[data-v]') : null;
  if (!b) return;
  view = b.getAttribute('data-v');
  try { localStorage.setItem(VKEY, view); } catch(e){}
  renderCards();
});
document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Escape') return;
  if (!$('viewer').hidden){ $('viewer').hidden = true; $('viewer-img').src = ''; }
  else if (!$('sheet').hidden && !pend) closeSheet();
});
$('sun-orbit').innerHTML = orbitHtml('sun');
$('cam-orbit').innerHTML = orbitHtml('cam');
renderCards();
})();
</script>
